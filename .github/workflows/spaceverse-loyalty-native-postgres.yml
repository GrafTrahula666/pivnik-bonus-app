name: SPACEVERSE loyalty native PostgreSQL

# Dedicated, unprivileged PR regression. Uses only a disposable local service,
# never Railway or any production connection string or GitHub secret.
on:
  pull_request:
    paths:
      - 'admin-platform/server/writes.ts'
      - 'admin-platform/src/phaseC/ProductionManagers.tsx'
      - 'admin-platform/server/tests/postgres.integration.spec.ts'
      - 'admin-platform/server/tests/loyalty-tenant-boundary.spec.ts'
      - 'admin-platform/server/tests/write-security.spec.ts'
      - '.github/workflows/spaceverse-loyalty-native-postgres.yml'

permissions:
  contents: read

jobs:
  native-loyalty:
    name: Loyalty tenant boundary / PostgreSQL 16 (disposable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-loyalty-only
          POSTGRES_DB: codex_admin_test_loyalty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_admin_test_loyalty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-platform/package-lock.json
      - name: Install exact Business dependencies
        run: npm ci --prefix admin-platform
      - name: Run native tenant + loyalty regression (disposable database ONLY)
        env:
          ADMIN_INTEGRATION_TEST_DATABASE_URL: postgres://postgres:disposable-loyalty-only@127.0.0.1:5432/codex_admin_test_loyalty
        run: |
          node -e "const u=new URL(process.env.ADMIN_INTEGRATION_TEST_DATABASE_URL);if(u.hostname!=='127.0.0.1'||u.pathname!=='/codex_admin_test_loyalty'||u.username!=='postgres')process.exit(1)"
          npm test --prefix admin-platform -- server/tests/postgres.integration.spec.ts --maxWorkers=1 --testTimeout=30000
