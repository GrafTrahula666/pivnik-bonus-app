name: Keep only direct closed beta removal

on:
  push:
    branches:
      - vk-mini-app-test
    paths:
      - .github/workflows/restore-app-keep-no-beta.yml

permissions:
  contents: write

jobs:
  restore-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vk-mini-app-test
          fetch-depth: 0
      - name: Restore app.js and keep index badge deleted
        shell: bash
        run: |
          git checkout 7b0deffc056c81a394571f5841a3f81f7de2e4df -- app.js
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<span class="beta-badge">закрытая бета</span>', '')
          s = s.replace('<span class="beta-badge">ЗАКРЫТАЯ БЕТА</span>', '')
          s = re.sub(r'styles\.css\?v=[^"\']+', 'styles.css?v=17.8-no-beta-direct', s)
          s = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=17.8-no-beta-direct', s)
          p.write_text(s, encoding='utf-8')
          if 'закрытая бета' in s.lower() or 'class="beta-badge"' in s:
              raise SystemExit('beta badge still exists in index.html')
          PY
          if git diff --quiet -- app.js index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "fix(vk): remove closed beta badge directly from HTML"
          git push origin HEAD:vk-mini-app-test
