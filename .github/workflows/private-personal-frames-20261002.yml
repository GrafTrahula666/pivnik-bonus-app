name: Issue and verify personal frames through private production connection
on:
  push:
    branches: [ops/private-personal-frames-20261002]
permissions:
  contents: read
concurrency:
  group: personal-frames-20261002
  cancel-in-progress: false
jobs:
  private-command:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify exact production release, issue two frames and verify profiles
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_COMMIT_SHA: 835bf4730361ec9c730689e6365cfe3253d3ad3a
        run: node scripts/railway-grant-personal-frames.mjs
