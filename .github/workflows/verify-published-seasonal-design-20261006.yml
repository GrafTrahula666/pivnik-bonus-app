name: Verify published seasonal design
on:
  push:
    branches: [ops/verify-halloween-publication-20261006]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c04bccef04c40556e22a0404b9b4c8babf647231
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify seasonal design and actual owner metadata
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_COMMIT_SHA: c04bccef04c40556e22a0404b9b4c8babf647231
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('scripts/railway-production-auth-smoke.mjs','utf8');
          const split=source.indexOf('const [telegramVariables, vkVariables] = await Promise.all([');
          if(split<0)throw new Error('Unexpected smoke source');
          fs.writeFileSync('scripts/seasonal-theme-verification.mjs',source.slice(0,split)+"\nimport assert from 'node:assert/strict';\nconst [tgVariables,vkVariables] = await Promise.all([\n  serviceVariables(RAILWAY_PRODUCTION.services.telegram),serviceVariables(RAILWAY_PRODUCTION.services.vk)\n]);\nconst tgUrl=productionUrl('telegram',tgVariables.TELEGRAM_APP_URL);\nconst vkUrl=productionUrl('vk',vkVariables.VK_APP_URL);\nconst chatResponse=await fetch('https://api.telegram.org/bot'+tgVariables.TELEGRAM_BOT_TOKEN+'/getChat', {\n  method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:tgVariables.OWNER_TELEGRAM_ID}),signal:AbortSignal.timeout(15000)\n}).catch(()=>{throw new Error('Owner metadata lookup failed')});\nconst chat=await chatResponse.json();\nassert.ok(chatResponse.ok && chat.ok && chat.result?.type === 'private', 'Cannot verify actual owner metadata');\nassert.equal(String(chat.result.id),String(tgVariables.OWNER_TELEGRAM_ID));\nconst owner=await fetchJson(tgUrl+'/api/auth',{method:'POST',body:JSON.stringify({initData:telegramInitData(tgVariables.TELEGRAM_BOT_TOKEN,{\n  provider_user_id:String(chat.result.id),username:chat.result.username,first_name:chat.result.first_name,last_name:chat.result.last_name || ''\n})})});\nassert.equal(owner.profile.role,'admin');\nassert.equal(owner.profile.firstName,chat.result.first_name);\nassert.equal(owner.profile.lastName || '',chat.result.last_name || '');\nconst [tgSession,vkSession] = await Promise.all([\n  authenticateTwice({platform:'telegram',baseUrl:tgUrl,body:()=>({initData:telegramInitData(tgVariables.TELEGRAM_BOT_TOKEN,CANARIES.telegram)})}),\n  authenticateTwice({platform:'vk',baseUrl:vkUrl,body:()=>({platform:'vk',launchParams:vkLaunchParams(vkVariables.VK_APP_ID,vkVariables.VK_APP_SECRET,CANARIES.vk.provider_user_id),user:{id:Number(CANARIES.vk.provider_user_id),screen_name:CANARIES.vk.username,first_name:CANARIES.vk.first_name,last_name:''}})})\n]);\nconst [tgMe,vkMe]=await Promise.all([\n  fetchJson(tgUrl+'/api/me',{headers:{authorization:'Bearer '+tgSession.token}}),\n  fetchJson(vkUrl+'/api/me',{headers:{authorization:'Bearer '+vkSession.token}})\n]);\nassert.equal(tgMe.design?.theme,'halloween');\nassert.deepEqual(tgMe.design,vkMe.design);\nconsole.log(JSON.stringify({ok:true,telegramPublishedTheme:tgMe.design.theme,vkPublishedTheme:vkMe.design.theme,ownerMetadataMatchesTelegram:true,balancesStable:true},null,2));\n");
          await import('./scripts/seasonal-theme-verification.mjs');
          NODE
