name: One-time release polish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-release-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply scoped UI polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          source = path.read_text(encoding='utf-8')
          marker = '/* V19.3 · release polish */'
          if marker not in source:
              block = r'''

/* V19.3 · release polish */
/* Larger, labelled back navigation for full-screen transitions. */
.wheel-page-head {
  grid-template-columns: 90px minmax(0, 1fr) 90px;
  min-height: 48px;
  padding-inline: 2px;
}

.wheel-page-head h2 {
  overflow: hidden;
  font-size: 20px;
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.wheel-back {
  display: inline-flex;
  width: auto;
  min-width: 90px;
  height: 44px;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  padding: 0 11px;
  border: 1px solid rgba(218, 161, 91, .28);
  border-radius: 14px;
  background: rgba(12, 7, 9, .58);
  color: #dfbc87;
  font-size: 30px;
  line-height: 1;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
}

.wheel-back::after {
  content: 'Назад';
  position: relative;
  top: 1px;
  font-size: 12px;
  font-weight: 720;
  line-height: 1;
}

.wheel-head-spacer {
  width: 90px;
}

.screen[data-screen='staff'] .service-back,
.screen[data-screen='admin'] .service-back {
  display: inline-flex;
  min-height: 42px;
  align-items: center;
  justify-content: center;
  margin: 0 0 10px;
  padding: 0 13px;
  border: 1px solid rgba(218, 161, 91, .27);
  border-radius: 13px;
  background: rgba(13, 8, 10, .58);
  color: #dfbc87;
  font-size: 13px;
  font-weight: 720;
  line-height: 1;
  text-decoration: none;
}

/* Owner panel: put operational tools first and keep editing tools out of the way. */
.screen[data-screen='admin'].active {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 34px;
}

.screen[data-screen='admin'] > * { min-width: 0; }
.screen[data-screen='admin'] .admin-head { order: 0; }
.screen[data-screen='admin'] .admin-quick-grid { order: 1; }
.screen[data-screen='admin'] .metric-grid { order: 2; }
.screen[data-screen='admin'] .shift-admin-card { order: 3; }
.screen[data-screen='admin'] .content-admin-card { order: 4; }
.screen[data-screen='admin'] .admin-preview-card { order: 5; }
.screen[data-screen='admin'] > .owner-only { order: 9; }

.screen[data-screen='admin'] .admin-head {
  margin: 0;
  padding: 15px;
  align-items: flex-start;
  border: 1px solid rgba(218, 161, 91, .24);
  border-radius: 21px;
  background: radial-gradient(circle at 88% 0%, rgba(122, 34, 49, .23), transparent 38%), linear-gradient(145deg, rgba(24, 12, 16, .92), rgba(8, 6, 8, .9));
  box-shadow: 0 15px 36px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.035);
}
.screen[data-screen='admin'] .admin-head > div { min-width: 0; }
.screen[data-screen='admin'] .admin-head h2 { margin-top: 3px; color: #f2dfbf; font-size: 25px; letter-spacing: -.025em; }
.screen[data-screen='admin'] .admin-head .muted { display: block; color: #9c8264; font-size: 11px; }
.screen[data-screen='admin'] #adminRoleBadge { margin-top: 4px; flex: 0 0 auto; }

.screen[data-screen='admin'] .admin-quick-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin: 0;
}
.screen[data-screen='admin'] .admin-quick-grid button {
  position: relative;
  display: grid;
  min-width: 0;
  min-height: 104px;
  align-content: end;
  gap: 4px;
  padding: 13px;
  overflow: hidden;
  border: 1px solid rgba(215, 157, 86, .2);
  border-radius: 18px;
  background: linear-gradient(150deg, rgba(255,226,178,.035), transparent 45%), rgba(10, 6, 9, .7);
  color: #efe0c8;
  text-align: left;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
}
.screen[data-screen='admin'] .admin-quick-grid button::before {
  display: grid;
  width: 35px;
  height: 35px;
  place-items: center;
  margin-bottom: 8px;
  border: 1px solid rgba(215, 158, 87, .28);
  border-radius: 12px;
  background: rgba(102, 28, 42, .22);
  color: #d9b37e;
  font-size: 17px;
}
.screen[data-screen='admin'] .admin-quick-grid button:nth-child(1)::before { content: '◎'; }
.screen[data-screen='admin'] .admin-quick-grid button:nth-child(2)::before { content: '≡'; }
.screen[data-screen='admin'] .admin-quick-grid button:nth-child(3)::before { content: '✉'; }
.screen[data-screen='admin'] .admin-quick-grid button:nth-child(4)::before { content: '◇'; }
.screen[data-screen='admin'] .admin-quick-grid button span { overflow: hidden; font-size: 13px; font-weight: 760; line-height: 1.2; text-overflow: ellipsis; }
.screen[data-screen='admin'] .admin-quick-grid button small { color: #90775e; font-size: 9px; line-height: 1.32; }

.screen[data-screen='admin'] .metric-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 0;
}
.screen[data-screen='admin'] .metric {
  min-height: 94px;
  padding: 12px;
  border-radius: 17px;
  border-color: rgba(216, 158, 87, .16);
  background: rgba(10, 6, 8, .64);
}
.screen[data-screen='admin'] .metric:nth-child(5) { min-height: 78px; grid-column: 1 / -1; }
.screen[data-screen='admin'] .metric > span { color: #92795e; font-size: 9px; }
.screen[data-screen='admin'] .metric > strong { margin: 4px 0 2px; color: #efd6aa; font-size: 27px; font-weight: 760; letter-spacing: -.035em; }
.screen[data-screen='admin'] .metric > small { color: #746351; font-size: 9px; line-height: 1.3; }
.screen[data-screen='admin'] .metric-alert { border-color: rgba(220, 103, 104, .25); background: linear-gradient(145deg, rgba(90, 27, 35, .3), rgba(11, 6, 8, .68)); }

.screen[data-screen='admin'] > .card {
  margin: 0;
  padding: 15px;
  border: 1px solid rgba(214, 156, 84, .19);
  border-radius: 20px;
  background: linear-gradient(145deg, rgba(255,225,174,.025), transparent 42%), rgba(9, 6, 8, .68);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
}
.screen[data-screen='admin'] > .card .card-head {
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 11px;
  border-bottom: 1px solid rgba(214, 155, 83, .11);
}
.screen[data-screen='admin'] > .card .card-head h3 { margin: 0; color: #f0dfc4; font-size: 16px; line-height: 1.2; }
.screen[data-screen='admin'] > .card .card-head p { margin: 4px 0 0; color: #88735c; font-size: 10px; line-height: 1.4; }
.screen[data-screen='admin'] .shift-staff-options,
.screen[data-screen='admin'] .admin-content-list,
.screen[data-screen='admin'] .operation-list,
.screen[data-screen='admin'] .inquiry-list { border-radius: 15px; }
.screen[data-screen='admin'] .content-admin-columns { display: grid; grid-template-columns: 1fr; gap: 14px; }
.screen[data-screen='admin'] .content-admin-columns > section { min-width: 0; padding: 11px; border: 1px solid rgba(214, 156, 84, .12); border-radius: 16px; background: rgba(0,0,0,.14); }
.screen[data-screen='admin'] .content-admin-title { margin-bottom: 9px; }
.screen[data-screen='admin'] .content-admin-actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
.screen[data-screen='admin'] .content-admin-actions button,
.screen[data-screen='admin'] .two-buttons button { min-height: 44px; }
.screen[data-screen='admin'] > .owner-only { opacity: .86; border-style: dashed; }
.screen[data-screen='admin'] > .owner-only::before { content: 'Дополнительные настройки'; display: block; margin-bottom: 10px; color: #8d765d; font-size: 9px; font-weight: 760; letter-spacing: .1em; text-transform: uppercase; }
.screen[data-screen='admin'] .design-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.screen[data-screen='admin'] .toggle-list { gap: 7px; }
.screen[data-screen='admin'] .toggle-list label,
.screen[data-screen='admin'] .design-grid label { border: 1px solid rgba(214, 156, 84, .1); border-radius: 13px; }
.screen[data-screen='admin'] .admin-hint,
.screen[data-screen='admin'] .shift-meta { display: block; margin-top: 10px; color: #766451; font-size: 9px; line-height: 1.45; }

@media (max-width: 355px) {
  .wheel-page-head { grid-template-columns: 78px minmax(0, 1fr) 78px; }
  .wheel-back { min-width: 78px; padding-inline: 9px; }
  .wheel-head-spacer { width: 78px; }
  .wheel-page-head h2 { font-size: 18px; }
  .screen[data-screen='admin'] .admin-quick-grid button { min-height: 96px; padding: 11px; }
  .screen[data-screen='admin'] .admin-quick-grid button small { font-size: 8px; }
}
'''
              path.write_text(source.rstrip() + block + '\n', encoding='utf-8')
          PY

      - name: Verify scoped patch
        shell: bash
        run: |
          grep -Fq '/* V19.3 · release polish */' styles.css
          grep -Fq '.wheel-back::after' styles.css
          grep -Fq ".screen[data-screen='admin'].active" styles.css

      - name: Commit polish and remove helper workflow
        shell: bash
        run: |
          git config user.name "Pivnik Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-release-polish.yml
          git add styles.css
          git commit -m "Polish back navigation and owner admin panel"
          git push origin HEAD:main
