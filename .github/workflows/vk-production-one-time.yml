name: VK production one-time switch

on:
  push:
    branches:
      - ui/black-frosted-controls-smoke-stage6
    paths:
      - .github/workflows/vk-production-one-time.yml

permissions:
  contents: read

jobs:
  deploy-vk-production:
    if: contains(github.event.head_commit.message, '[VK-PROD-SWITCH]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build VK native bundle against Selectel gateway
        env:
          PIVNIK_VK_API_BASE: https://139.100.238.159.nip.io
        run: npm run build:vk-hosting

      - name: Verify bundle routing and VK runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f vk-hosting-build/index.html
          test -f vk-hosting-build/app.js
          test -f vk-hosting-build/vk-platform.js
          grep -q '__PIVNIK_VK_API_BASE__' vk-hosting-build/index.html
          grep -q 'https://139.100.238.159.nip.io' vk-hosting-build/index.html
          grep -q 'resolveGatewayInput' vk-hosting-build/vk-platform.js
          if grep -q 'telegram.org/js/telegram-web-app.js' vk-hosting-build/index.html; then
            echo 'Telegram runtime leaked into VK native bundle'
            exit 1
          fi

      - name: Deploy exact bundle to VK Mini Apps Hosting production
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: production
          CI_URLS: "true"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MINI_APPS_ACCESS_TOKEN" ]; then
            echo "VK_MINI_APPS_ACCESS_TOKEN is not configured"
            exit 1
          fi
          npx -y @vkontakte/vk-miniapps-deploy@1.0.2
