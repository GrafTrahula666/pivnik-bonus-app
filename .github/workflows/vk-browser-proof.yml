name: Temporary VK browser proof

on:
  push:
    branches:
      - ops/vk-testing-group-audit-20260823
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  BASE_URL: https://pivnik-vk-proxy.vercel.app
  VK_APP_ID: '54694987'

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run signed VK browser flow
        env:
          VK_APP_SECRET: ${{ secrets.VK_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VK_APP_SECRET"
          mkdir -p proof
          node <<'NODE'
          const { chromium } = require('playwright');
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const base = process.env.BASE_URL;
          const secret = process.env.VK_APP_SECRET;
          const params = new URLSearchParams({
            vk_app_id: process.env.VK_APP_ID,
            vk_user_id: '99854694987',
            vk_ts: String(Math.floor(Date.now() / 1000)),
            vk_language: 'ru',
            vk_platform: 'mobile_iphone',
            vk_ref: 'browser_proof'
          });
          const signedPairs = [...params.entries()]
            .filter(([key]) => key.startsWith('vk_'))
            .sort(([a], [b]) => a.localeCompare(b));
          const signedQuery = new URLSearchParams(signedPairs).toString();
          const sign = crypto.createHmac('sha256', secret).update(signedQuery).digest('base64url');
          params.set('sign', sign);
          const launchUrl = `${base}/vk?${params.toString()}`;

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 VKBrowser/1.0'
            });
            const page = await context.newPage();
            const events = [];
            page.on('console', msg => events.push(`console:${msg.type()}:${msg.text()}`));
            page.on('pageerror', err => events.push(`pageerror:${err.message}`));
            page.on('response', res => {
              const url = new URL(res.url());
              if (url.pathname.startsWith('/api/')) events.push(`response:${res.status()}:${url.pathname}`);
            });

            await page.goto(launchUrl, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('#appShell:not(.hidden)', { timeout: 20000 });

            const consent = page.locator('#consentModal.open');
            if (await consent.count()) {
              const accept = page.locator('#acceptTerms');
              if (await accept.count()) {
                await accept.click();
                await page.waitForTimeout(1200);
              }
            }
            const setup = page.locator('#profileSetupModal.open');
            if (await setup.count()) {
              const close = page.locator('#profileSetupClose');
              if (await close.count()) {
                await close.click();
                await page.waitForTimeout(500);
              }
            }

            const shellVisible = await page.locator('#appShell').evaluate(el => !el.classList.contains('hidden'));
            const bootVisible = await page.locator('#bootScreen').evaluate(el => !el.classList.contains('hidden'));
            const profileName = (await page.locator('#profileName').textContent().catch(() => '')) || '';
            const clientName = (await page.locator('#clientName').textContent().catch(() => '')) || '';
            const balance = (await page.locator('#clientBalance').textContent().catch(() => '')) || '';

            await page.screenshot({ path: 'proof/vk-browser-proof.png', fullPage: true });
            fs.writeFileSync('proof/browser-events.txt', events.join('\n') + '\n');
            fs.writeFileSync('proof/result.txt', [
              `APP_SHELL_VISIBLE=${shellVisible}`,
              `BOOT_VISIBLE=${bootVisible}`,
              `PROFILE_NAME=${profileName.trim()}`,
              `CLIENT_NAME=${clientName.trim()}`,
              `BALANCE=${balance.trim()}`
            ].join('\n') + '\n');

            console.log(`APP_SHELL_VISIBLE=${shellVisible}`);
            console.log(`BOOT_VISIBLE=${bootVisible}`);
            console.log(`PROFILE_NAME=${profileName.trim()}`);
            console.log(`CLIENT_NAME=${clientName.trim()}`);
            console.log(`BALANCE=${balance.trim()}`);

            if (!shellVisible) throw new Error('App shell did not open');
            if (bootVisible) throw new Error('Boot screen is still visible');
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-browser-proof
          path: proof/
          retention-days: 7
