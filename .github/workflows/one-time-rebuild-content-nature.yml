name: One-time Pivnik test-client seed verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/rebuild-content-nature'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      PROJECT_ID: 20a942f9-3164-484a-a6f1-565439e38705
      ENVIRONMENT_ID: cdd9d26c-2aab-45d9-95ed-ef487fafaa8f
      WORKSPACE_ID: fb7b2ccc-bf39-4fcb-81df-b33235cc4717
      APP_SERVICE: pivnik-bonus-app
      APP_URL: https://pivnik-bonus-app-production-df60.up.railway.app
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Link exact isolated Pivnik service
        run: railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$APP_SERVICE" --workspace "$WORKSPACE_ID" --json
      - name: Redeploy current main so prestart seeds the real test client
        shell: bash
        run: |
          set -euo pipefail
          railway up --ci --message "Seed Pivnik test client after database initialization"
      - name: Verify test client was seeded and service stayed healthy
        shell: bash
        run: |
          set -euo pipefail
          logs=$(railway logs -s "$APP_SERVICE" -e "$ENVIRONMENT_ID" --deployment --latest --lines 250)
          printf '%s\n' "$logs"
          printf '%s\n' "$logs" | grep -q 'Pivnik test client ready:'
          body=$(curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health")
          printf '%s\n' "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok) process.exit(1); if(Number(x.users)<1) throw new Error(`Expected at least one seeded user, got ${x.users}`); console.log(`TEST_CLIENT_HEALTH_OK users=${x.users}`)' "$body"
      - name: Verify public root still serves Pivnik
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$APP_URL/" >/tmp/root.html
          grep -q '<title>Пивник | Бонусы</title>' /tmp/root.html
          grep -q 'id="bootScreen"' /tmp/root.html
          ! grep -q 'The train has not arrived at the station' /tmp/root.html
          echo "PUBLIC_ROOT_OK=$APP_URL"
      - name: Show latest logs on failure
        if: failure()
        shell: bash
        run: |
          railway deployment list -s "$APP_SERVICE" -e "$ENVIRONMENT_ID" --limit 3 --json || true
          railway logs -s "$APP_SERVICE" -e "$ENVIRONMENT_ID" --deployment --latest --lines 300 || true
