name: One-time Pivnik Telegram menu label verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/rebuild-content-nature'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      PROJECT_ID: 20a942f9-3164-484a-a6f1-565439e38705
      ENVIRONMENT_ID: cdd9d26c-2aab-45d9-95ed-ef487fafaa8f
      WORKSPACE_ID: fb7b2ccc-bf39-4fcb-81df-b33235cc4717
      APP_SERVICE: pivnik-bonus-app
      APP_URL: https://pivnik-bonus-app-production-df60.up.railway.app
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Confirm exact label is committed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "text: 'Открыть ПРИЛОЖЕНИЕ'" scripts/repair-telegram-runtime.mjs
          ! grep -Fq "text: 'Открыть ПИВНИК'" scripts/repair-telegram-runtime.mjs
          echo 'SOURCE_LABEL_OK=true'
      - name: Link restored Pivnik service
        run: railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$APP_SERVICE" --workspace "$WORKSPACE_ID" --json
      - name: Deploy current main so runtime applies the new label
        shell: bash
        run: |
          set -euo pipefail
          railway up --ci --message "Rename Telegram menu button to Открыть ПРИЛОЖЕНИЕ"
      - name: Verify Telegram menu exact text and URL
        shell: bash
        run: |
          set -euo pipefail
          menu=$(curl --fail --silent --show-error --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChatMenuButton")
          node -e '
            const menu=JSON.parse(process.argv[1]);
            const expectedUrl=String(process.env.APP_URL||"").replace(/\/+$/,"");
            const actualUrl=String(menu.result?.web_app?.url||"").replace(/\/+$/,"");
            const text=String(menu.result?.text||"");
            console.log(`MENU_TYPE=${menu.result?.type||""}`);
            console.log(`MENU_TEXT=${text}`);
            console.log(`MENU_URL=${actualUrl}`);
            if(!menu.ok || menu.result?.type!=="web_app") throw new Error("Telegram menu is not web_app");
            if(text!=="Открыть ПРИЛОЖЕНИЕ") throw new Error(`Wrong menu text: ${text}`);
            if(actualUrl!==expectedUrl) throw new Error(`Wrong menu URL: ${actualUrl}`);
            console.log("TELEGRAM_MENU_LABEL_OK=true");
          ' "$menu"
      - name: Verify live app stayed healthy
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health")
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok) throw new Error("Health failed"); console.log(`PUBLIC_APP_OK=true users=${x.users}`);' "$body"
