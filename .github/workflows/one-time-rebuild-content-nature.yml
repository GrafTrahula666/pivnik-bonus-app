name: One-time Pivnik Telegram menu label verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/rebuild-content-nature'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://pivnik-bonus-app-production-df60.up.railway.app
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm exact label is committed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "text: 'Открыть ПРИЛОЖЕНИЕ'" scripts/repair-telegram-runtime.mjs
          ! grep -Fq "text: 'Открыть ПИВНИК'" scripts/repair-telegram-runtime.mjs
          echo 'SOURCE_LABEL_OK=true'
      - name: Force and poll exact Telegram menu text
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const token=process.env.TELEGRAM_BOT_TOKEN;
          const url=String(process.env.APP_URL||'').replace(/\/+$/,'');
          const desired='Открыть ПРИЛОЖЕНИЕ';
          const api=async(method,payload)=>{
            const r=await fetch(`https://api.telegram.org/bot${token}/${method}`,{
              method:payload?'POST':'GET',
              headers:payload?{'content-type':'application/json'}:undefined,
              body:payload?JSON.stringify(payload):undefined
            });
            const x=await r.json();
            if(!r.ok||!x.ok) throw new Error(`${method} failed: ${JSON.stringify(x)}`);
            return x.result;
          };
          let last=null;
          for(let attempt=1; attempt<=10; attempt++){
            await api('setChatMenuButton',{menu_button:{type:'web_app',text:desired,web_app:{url}}});
            await new Promise(r=>setTimeout(r,2500));
            last=await api('getChatMenuButton');
            const actualUrl=String(last?.web_app?.url||'').replace(/\/+$/,'');
            console.log(`ATTEMPT=${attempt} MENU_TEXT=${last?.text||''} MENU_URL=${actualUrl}`);
            if(last?.type==='web_app' && last?.text===desired && actualUrl===url){
              console.log('TELEGRAM_MENU_LABEL_OK=true');
              process.exit(0);
            }
          }
          throw new Error(`Telegram kept unexpected menu: ${JSON.stringify(last)}`);
          NODE
      - name: Verify live app stayed healthy
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health")
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok) throw new Error("Health failed"); console.log(`PUBLIC_APP_OK=true users=${x.users}`);' "$body"
