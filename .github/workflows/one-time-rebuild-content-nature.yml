name: One-time Pivnik final Telegram verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/rebuild-content-nature'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      PROJECT_ID: 20a942f9-3164-484a-a6f1-565439e38705
      ENVIRONMENT_ID: cdd9d26c-2aab-45d9-95ed-ef487fafaa8f
      WORKSPACE_ID: fb7b2ccc-bf39-4fcb-81df-b33235cc4717
      APP_SERVICE: pivnik-bonus-app
      APP_URL: https://pivnik-bonus-app-production-df60.up.railway.app
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Verify Telegram bot identity and menu URL
        shell: bash
        run: |
          set -euo pipefail
          me=$(curl --fail --silent --show-error --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          menu=$(curl --fail --silent --show-error --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChatMenuButton")
          node -e '
            const me=JSON.parse(process.argv[1]);
            const menu=JSON.parse(process.argv[2]);
            const expected=String(process.env.APP_URL||"").replace(/\/+$/,"");
            const actual=String(menu.result?.web_app?.url||"").replace(/\/+$/,"");
            if(!me.ok || String(me.result?.username||"").toLowerCase()!=="pivnik_bonus_bot") throw new Error("Wrong Telegram bot");
            if(!menu.ok || menu.result?.type!=="web_app") throw new Error("Telegram menu is not web_app");
            if(actual!==expected) throw new Error(`Wrong menu URL: ${actual}`);
            console.log(`BOT=@${me.result.username}`);
            console.log(`MENU=${menu.result.text}`);
            console.log(`MENU_URL=${actual}`);
            console.log("TELEGRAM_MENU_OK=true");
          ' "$me" "$menu"
      - name: Verify live public Pivnik root and health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$APP_URL/" >/tmp/root.html
          grep -q '<title>Пивник | Бонусы</title>' /tmp/root.html
          grep -q 'id="bootScreen"' /tmp/root.html
          ! grep -q 'The train has not arrived at the station' /tmp/root.html
          body=$(curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health")
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok) throw new Error("Health failed"); if(Number(x.users)<1) throw new Error("Test client missing"); console.log(`PUBLIC_APP_OK=true users=${x.users}`);' "$body"
      - name: Verify Railway deployment and runtime markers
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$APP_SERVICE" --workspace "$WORKSPACE_ID" --json >/dev/null
          deployments=$(railway deployment list -s "$APP_SERVICE" -e "$ENVIRONMENT_ID" --limit 1 --json)
          node -e 'const x=JSON.parse(process.argv[1]); if(!Array.isArray(x)||x[0]?.status!=="SUCCESS") throw new Error("Latest Railway deployment is not SUCCESS"); console.log(`DEPLOYMENT_OK=${x[0].id}`);' "$deployments"
          logs=$(railway logs -s "$APP_SERVICE" -e "$ENVIRONMENT_ID" --deployment --latest --lines 220)
          printf '%s\n' "$logs" | grep -Fq "Telegram bot menu repaired: $APP_URL"
          printf '%s\n' "$logs" | grep -q 'Pivnik test client ready:'
          printf '%s\n' "$logs" | grep -q 'Applied unlimited cancellation for owner/admin; staff limits remain unchanged.'
          echo 'RUNTIME_MARKERS_OK=true'
