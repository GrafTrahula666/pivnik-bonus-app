name: One-time Pivnik runtime diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/rebuild-content-nature'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      PROJECT_ID: 20a942f9-3164-484a-a6f1-565439e38705
      ENVIRONMENT_ID: cdd9d26c-2aab-45d9-95ed-ef487fafaa8f
      WORKSPACE_ID: fb7b2ccc-bf39-4fcb-81df-b33235cc4717
      APP_SERVICE: pivnik-bonus-app
      FAILED_DEPLOYMENT_ID: 5cff2e41-9c80-4433-8f22-70dcd7123aef
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Link exact isolated Pivnik service
        run: railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$APP_SERVICE" --workspace "$WORKSPACE_ID" --json
      - name: Show failed deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          railway deployment list -s "$APP_SERVICE" -e "$ENVIRONMENT_ID" --limit 10 --json
      - name: Show failed deployment runtime logs
        shell: bash
        run: |
          set -euo pipefail
          railway logs "$FAILED_DEPLOYMENT_ID" -s "$APP_SERVICE" -e "$ENVIRONMENT_ID" --deployment --lines 300
