name: One-time legacy Railway project recovery probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/recover-legacy-railway-db'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOKEN_ACCOUNT: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
    steps:
      - name: Inspect Railway recovery API surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=String(process.env.TOKEN_ACCOUNT||'').trim();
          if(!token) throw new Error('account token missing');
          const query=`query Introspection {
            __schema {
              queryType { fields { name args { name type { kind name ofType { kind name } } } } }
              mutationType { fields { name args { name type { kind name ofType { kind name } } } } }
              types { name kind fields { name args { name type { kind name ofType { kind name } } } } }
            }
          }`;
          const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query})});
          const p=await r.json();
          if(!r.ok||p.errors?.length) throw new Error((p.errors||[]).map(x=>x.message).join('; ')||`HTTP ${r.status}`);
          const s=p.data.__schema;
          const hit=/restore|recover|delete|archive|volume|workspace|project|service/i;
          const fmtType=t=>{if(!t)return'';return t.name||t.ofType?.name||t.kind};
          const fmtField=f=>({name:f.name,args:(f.args||[]).map(a=>`${a.name}:${fmtType(a.type)}`)});
          console.log('QUERY_FIELDS='+JSON.stringify((s.queryType?.fields||[]).filter(f=>hit.test(f.name)).map(fmtField),null,2));
          console.log('MUTATION_FIELDS='+JSON.stringify((s.mutationType?.fields||[]).filter(f=>hit.test(f.name)).map(fmtField),null,2));
          const types=(s.types||[]).filter(t=>/volume|project|workspace|service|deleted|archiv|recover|restore/i.test(t.name||''));
          console.log('RELEVANT_TYPES='+JSON.stringify(types.map(t=>({name:t.name,kind:t.kind,fields:(t.fields||[]).filter(f=>hit.test(f.name)).map(fmtField)})),null,2));
          NODE
