name: One-time legacy Railway project recovery probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/recover-legacy-railway-db'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOKEN_ACCOUNT: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      OLD_PROJECT_ID: 9a940d7a-b0b0-4893-a90d-1b0a8b6850d5
      CURRENT_WORKSPACE_ID: fb7b2ccc-bf39-4fcb-81df-b33235cc4717
    steps:
      - name: Claim legacy Pivnik project into active workspace
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=String(process.env.TOKEN_ACCOUNT||'').trim();
          const id=process.env.OLD_PROJECT_ID;
          const workspaceId=process.env.CURRENT_WORKSPACE_ID;
          if(!token) throw new Error('account token missing');
          const mutation=`mutation Claim($id:String!,$workspaceId:String!){
            projectClaim(id:$id,workspaceId:$workspaceId){
              id name deletedAt workspaceId isTempProject
              services(first:100){edges{node{id name deletedAt}}}
              volumes(first:100){edges{node{id projectId}}}
            }
          }`;
          const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json','user-agent':'pivnik-legacy-claim/1.0'},body:JSON.stringify({query:mutation,variables:{id,workspaceId}})});
          const p=await r.json().catch(()=>({}));
          const errors=(p.errors||[]).map(x=>String(x.message||'')).join(' | ');
          console.log('CLAIM_HTTP='+r.status);
          console.log('CLAIM_OK='+Boolean(p.data?.projectClaim));
          console.log('CLAIM_ERROR='+errors.slice(0,1000));
          if(p.data?.projectClaim) console.log('CLAIM_PROJECT='+JSON.stringify(p.data.projectClaim,null,2));
          NODE
