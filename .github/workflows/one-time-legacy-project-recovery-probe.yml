name: One-time legacy Railway project recovery probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/recover-legacy-railway-db'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOKEN_ACCOUNT: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
    steps:
      - name: Inspect billing and subscription API surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=String(process.env.TOKEN_ACCOUNT||'').trim();
          const query=`query BillingMeta {
            __schema {
              queryType { fields { name description args { name description type { kind name ofType { kind name } } } type { kind name ofType { kind name } } } }
              mutationType { fields { name description args { name description type { kind name ofType { kind name } } } type { kind name ofType { kind name } } } }
              types { name kind fields { name description type { kind name ofType { kind name } } } }
            }
          }`;
          const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query})});
          const p=await r.json();
          if(p.errors?.length) throw new Error(p.errors.map(x=>x.message).join('; '));
          const hit=/bill|subscription|plan|trial|payment|checkout|invoice|free/i;
          const fmt=f=>({name:f.name,description:f.description,args:(f.args||[]).map(a=>({name:a.name,description:a.description,type:a.type.name||a.type.ofType?.name||a.type.kind})),returnType:f.type?.name||f.type?.ofType?.name||f.type?.kind});
          console.log('BILLING_QUERIES='+JSON.stringify((p.data.__schema.queryType?.fields||[]).filter(f=>hit.test(f.name)||hit.test(f.description||'')).map(fmt),null,2));
          console.log('BILLING_MUTATIONS='+JSON.stringify((p.data.__schema.mutationType?.fields||[]).filter(f=>hit.test(f.name)||hit.test(f.description||'')).map(fmt),null,2));
          const types=(p.data.__schema.types||[]).filter(t=>hit.test(t.name||''));
          console.log('BILLING_TYPES='+JSON.stringify(types.map(t=>({name:t.name,kind:t.kind,fields:(t.fields||[]).map(f=>({name:f.name,description:f.description,type:f.type?.name||f.type?.ofType?.name||f.type?.kind}))})),null,2));
          NODE
