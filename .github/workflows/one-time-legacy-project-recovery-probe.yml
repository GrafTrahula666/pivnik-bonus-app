name: One-time legacy Railway project recovery probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/recover-legacy-railway-db'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOKEN_ACCOUNT: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      OLD_WORKSPACE_ID: fbffb30c-9091-432f-9e09-9c59e1440304
    steps:
      - name: Read exact API-token workspace IDs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=String(process.env.TOKEN_ACCOUNT||'').trim();
          async function req(query){
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query})});
            return r.json();
          }
          const meta=await req(`query { t:__type(name:"ApiTokenWorkspace"){ fields { name description type { kind name ofType { kind name } } } } }`);
          console.log('API_TOKEN_WORKSPACE_FIELDS='+JSON.stringify(meta.data?.t?.fields||null,null,2));
          const fields=(meta.data?.t?.fields||[]).map(f=>f.name);
          const safe=['id','name','role','workspaceId'].filter(x=>fields.includes(x));
          if(!safe.length) throw new Error('No readable workspace identity fields');
          const q=`query { apiToken { workspaces { ${safe.join(' ')} } } }`;
          const p=await req(q);
          console.log('TOKEN_WORKSPACES='+JSON.stringify(p.data?.apiToken?.workspaces||null,null,2));
          console.log('TOKEN_WORKSPACES_ERROR='+(p.errors||[]).map(x=>x.message).join(' | ').slice(0,800));
          const rows=p.data?.apiToken?.workspaces||[];
          console.log('OLD_WORKSPACE_FOUND='+rows.some(x=>x.id===process.env.OLD_WORKSPACE_ID||x.workspaceId===process.env.OLD_WORKSPACE_ID));
          NODE
