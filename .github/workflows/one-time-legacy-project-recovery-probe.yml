name: One-time legacy Railway project recovery probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/recover-legacy-railway-db'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOKEN_ACCOUNT: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
    steps:
      - name: Inspect projectClaim semantics without mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=String(process.env.TOKEN_ACCOUNT||'').trim();
          const query=`query ClaimMeta {
            __schema {
              mutationType {
                fields {
                  name description isDeprecated deprecationReason
                  args { name description defaultValue type { kind name ofType { kind name ofType { kind name } } } }
                  type { kind name ofType { kind name ofType { kind name } } }
                }
              }
            }
            projectType: __type(name:"Project") { name fields { name description type { kind name ofType { kind name } } } }
          }`;
          const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query})});
          const p=await r.json();
          if(p.errors?.length) throw new Error(p.errors.map(x=>x.message).join('; '));
          const field=(p.data.__schema.mutationType.fields||[]).find(x=>x.name==='projectClaim');
          console.log('PROJECT_CLAIM_META='+JSON.stringify(field,null,2));
          const projectFields=(p.data.projectType?.fields||[]).filter(f=>/claim|temp|delete|workspace|volume|service/i.test(f.name));
          console.log('PROJECT_RECOVERY_FIELDS='+JSON.stringify(projectFields,null,2));
          NODE
