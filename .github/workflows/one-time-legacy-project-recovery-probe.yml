name: One-time legacy Railway project recovery probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/recover-legacy-railway-db'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOKEN_ACCOUNT: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      CURRENT_WORKSPACE_ID: fb7b2ccc-bf39-4fcb-81df-b33235cc4717
      OLD_WORKSPACE_ID: fbffb30c-9091-432f-9e09-9c59e1440304
    steps:
      - name: Resolve customer IDs and customer lookup API
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=String(process.env.TOKEN_ACCOUNT||'').trim();
          if(!token) throw new Error('account token missing');
          async function gql(query,variables={}){
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json','user-agent':'pivnik-customer-id-probe/1.0'},body:JSON.stringify({query,variables})});
            const p=await r.json().catch(()=>({}));
            return {status:r.status,p};
          }
          const meta=await gql(`query Meta {
            __schema { queryType { fields { name description args { name description type { kind name ofType { kind name ofType { kind name } } } } type { kind name ofType { kind name } } } } }
          }`);
          if(meta.p.errors?.length) throw new Error(meta.p.errors.map(x=>x.message).join('; '));
          const fields=meta.p.data.__schema.queryType.fields||[];
          const customerFields=fields.filter(f=>/customer/i.test(f.name)||/customer/i.test(f.description||''));
          console.log('DIRECT_CUSTOMER_QUERIES='+JSON.stringify(customerFields.map(f=>({name:f.name,description:f.description,args:(f.args||[]).map(a=>({name:a.name,type:a.type.name||a.type.ofType?.name||a.type.kind})),returnType:f.type?.name||f.type?.ofType?.name||f.type?.kind})),null,2));

          const current=await gql(`query Current($id:String!){ workspace(workspaceId:$id){
            id name plan projectCount(includeDeleted:true)
            customer { id billingEmail state isTrialing hasExhaustedFreePlan trialDaysRemaining isUsageSubscriber subscriptions { id status } }
          } }`,{id:process.env.CURRENT_WORKSPACE_ID});
          console.log('CURRENT_WORKSPACE_CUSTOMER='+JSON.stringify(current.p?.data?.workspace||null,null,2));
          console.log('CURRENT_WORKSPACE_CUSTOMER_ERROR='+(current.p?.errors||[]).map(x=>x.message).join(' | ').slice(0,500));

          const me=await gql(`query Me { me { id email name workspaces { id name plan projectCount(includeDeleted:true) customer { id billingEmail state isTrialing hasExhaustedFreePlan trialDaysRemaining isUsageSubscriber } } } }`);
          console.log('ME_WORKSPACES='+JSON.stringify(me.p?.data?.me||null,null,2));
          console.log('ME_WORKSPACES_ERROR='+(me.p?.errors||[]).map(x=>x.message).join(' | ').slice(0,500));

          // Read-only attempt to ask usage for the expired workspace; sometimes billing survives after workspace membership is hidden.
          const usage=await gql(`query U($workspaceId:String!){ estimatedUsage(workspaceId:$workspaceId,includeDeleted:true,measurements:[CPU_USAGE]){ estimatedValue } }`,{workspaceId:process.env.OLD_WORKSPACE_ID});
          console.log('OLD_WORKSPACE_BILLING_QUERY='+JSON.stringify(usage.p?.data||null));
          console.log('OLD_WORKSPACE_BILLING_ERROR='+(usage.p?.errors||[]).map(x=>x.message).join(' | ').slice(0,500));
          NODE
