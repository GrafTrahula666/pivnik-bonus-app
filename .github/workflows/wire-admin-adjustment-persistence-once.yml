name: Wire admin adjustment persistence once

on:
  push:
    branches:
      - audit/spaceverse-architecture-20260910

permissions:
  contents: write

jobs:
  wire-admin-adjustment:
    if: github.event.head_commit.message == 'Stage admin adjustment persistence wiring'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire adapter into canonical server
        shell: python
        run: |
          from pathlib import Path

          path = Path('server.js')
          source = path.read_text()

          import_anchor = "import { resolvePersonalQrRecord } from './qr-resolver.js';\n"
          import_line = "import { createAdminAdjustmentPersistence } from './admin-adjustment-persistence.js';\n"
          if import_line not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit('admin-adjustment wiring: qr-resolver import anchor is not unique')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old = """    await client.query('UPDATE wallets SET balance = $1, updated_at = NOW() WHERE user_id = $2', [newBalance, req.params.id]);
    await client.query(
      `INSERT INTO transactions (
         request_key, client_id, staff_id, mode, status,
         bonus_spent, bonus_earned, balance_after, reason, completed_at
       ) VALUES ($1,$2,$3,'adjustment','completed',$4,$5,$6,$7,NOW())`,
      [
        requestKey,
        req.params.id,
        req.user.id,
        amount < 0 ? Math.abs(amount) : 0,
        amount > 0 ? amount : 0,
        newBalance,
        reason
      ]
    );
"""
          new = """    await client.query('UPDATE wallets SET balance = $1, updated_at = NOW() WHERE user_id = $2', [newBalance, req.params.id]);
    const persistAdjustment = createAdminAdjustmentPersistence({
      query: client.query.bind(client)
    });
    await persistAdjustment({
      transaction: {
        request_key: requestKey,
        client_id: req.params.id,
        staff_id: req.user.id,
        mode: 'adjustment',
        status: 'completed',
        bonus_spent: amount < 0 ? Math.abs(amount) : 0,
        bonus_earned: amount > 0 ? amount : 0,
        balance_after: newBalance,
        reason
      }
    });
"""

          if old in source:
              if source.count(old) != 1:
                  raise SystemExit('admin-adjustment wiring: legacy INSERT block is not unique')
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('admin-adjustment wiring: expected legacy INSERT block not found')

          path.write_text(source)

      - name: Verify only canonical server changed
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = 'server.js' || {
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          }

      - name: Verify wiring and syntax
        run: |
          grep -Fq "createAdminAdjustmentPersistence" server.js
          grep -Fq "const persistAdjustment = createAdminAdjustmentPersistence" server.js
          node --check server.js
          git diff --check -- server.js

      - name: Commit canonical server wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server.js
          git diff --cached --quiet && exit 0
          git commit -m 'Wire admin adjustment through persistence boundary'
          git push origin HEAD:audit/spaceverse-architecture-20260910
