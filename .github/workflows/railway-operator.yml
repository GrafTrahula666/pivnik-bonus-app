name: Pivnik Railway operator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover Railway project
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Discover Pivnik Railway services
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: node scripts/railway-discover.mjs
