name: Pivnik Railway operator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose: safe statuses only; discover: prints accessible project metadata'
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - discover

permissions:
  contents: read

jobs:
  discover:
    name: Check Railway CI access (manual, main only)
    # Secrets must not be used from an unreviewed dispatch branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Diagnose CI Railway token scope without printing secrets
        if: inputs.mode == 'diagnose'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: node scripts/railway-ci-access-diagnostic.mjs --check

      - name: Discover Pivnik Railway services (prints resource metadata)
        if: inputs.mode == 'discover'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: node scripts/railway-discover.mjs
