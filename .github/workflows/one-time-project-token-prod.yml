name: One-time project-token production verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/verify-project-token-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main release
        uses: actions/checkout@v4
        with:
          ref: 686ff749fc922bbb6019d7eefa062b83eb6e0852
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Inspect Railway project-token scope
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')
          node -e 'const x=JSON.parse(process.argv[1]); if(x.errors?.length) throw new Error(x.errors.map(e=>e.message).join("; ")); const t=x.data?.projectToken; if(!t?.projectId||!t?.environmentId) throw new Error("Missing project token scope"); console.log(`TOKEN_PROJECT_ID=${t.projectId}`); console.log(`TOKEN_ENVIRONMENT_ID=${t.environmentId}`);' "$response"
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Verify Railway CLI can use the project token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway status --json || railway --version
