name: Admin dependency audit split (diagnostic)

on:
  pull_request:
    paths:
      - 'admin-platform/package.json'
      - 'admin-platform/package-lock.json'
      - '.github/workflows/admin-dependency-audit-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-platform/package-lock.json
      - name: Install locked Admin dependencies
        run: npm ci --prefix admin-platform
      - name: Audit full and production dependency graphs separately
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/admin-audit"
          npm audit --prefix admin-platform --json --audit-level=high > "$RUNNER_TEMP/admin-audit/full.json"
          full_status=$?
          npm audit --prefix admin-platform --omit=dev --json --audit-level=high > "$RUNNER_TEMP/admin-audit/production.json"
          production_status=$?
          echo "full_exit=$full_status" >> "$GITHUB_STEP_SUMMARY"
          echo "production_exit=$production_status" >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module - "$RUNNER_TEMP/admin-audit" <<'NODE'
          import fs from 'node:fs';
          const dir = process.argv[2];
          for (const mode of ['full', 'production']) {
            const report = JSON.parse(fs.readFileSync(`${dir}/${mode}.json`, 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log(`${mode}: ${JSON.stringify(counts)}`);
          }
          NODE
          if [ "$full_status" -ne 0 ] || [ "$production_status" -ne 0 ]; then
            echo "::error::Admin dependency audit is not clean; see separate JSON artifacts"
            exit 1
          fi
      - name: Upload both audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admin-audit/*.json
          if-no-files-found: warn
          retention-days: 14
