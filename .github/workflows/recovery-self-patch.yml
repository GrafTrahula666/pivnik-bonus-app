name: Recovery clean visual patch

on:
  push:
    branches:
      - 'recovery/clean-visual-vk-20260827'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/clean-visual-vk-20260827
          fetch-depth: 0

      - name: Apply minimal Luxury VIP Space protection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          source = path.read_text(encoding='utf-8')

          old_style = """  const root = document.documentElement;
          const colors = design.colors || {};
          root.style.setProperty('--bg', colors.background || '#0e0c0a');
          root.style.setProperty('--header', colors.header || '#15110e');
          root.style.setProperty('--surface', colors.surface || '#1c1612');
          root.style.setProperty('--card', colors.card || '#231a14');
          root.style.setProperty('--text', colors.text || '#f7eee5');
          root.style.setProperty('--muted', colors.muted || '#a99580');
          root.style.setProperty('--gold', colors.accent || '#e9a83b');
          root.style.setProperty('--gold2', colors.accentSoft || '#ffc96b');
          root.style.setProperty('--radius', `${Number(design.radius || 20)}px`);
          """
          new_style = """  // Keep server-side design data for texts and section visibility, while styles.css
          // remains the single source of truth for the Luxury VIP Space visual system.
          const platformUiColors = {
            background: '#050609',
            header: '#06070a'
          };
          """

          old_bridge = """  try {
            tg?.setHeaderColor(colors.header || '#15110e');
            tg?.setBackgroundColor(colors.background || '#0e0c0a');
          } catch (_) {}
          """
          new_bridge = """  try {
            tg?.setHeaderColor(platformUiColors.header);
            tg?.setBackgroundColor(platformUiColors.background);
          } catch (_) {}
          """

          if source.count(old_style) != 1:
              raise SystemExit(f'Expected exactly one legacy style block, found {source.count(old_style)}')
          if source.count(old_bridge) != 1:
              raise SystemExit(f'Expected exactly one legacy bridge color block, found {source.count(old_bridge)}')

          source = source.replace(old_style, new_style, 1).replace(old_bridge, new_bridge, 1)
          path.write_text(source, encoding='utf-8')
          PY

          cat > test/luxury-design-lock.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const appSource = fs.readFileSync(new URL('../app.js', import.meta.url), 'utf8');

          function applyDesignSource() {
            const start = appSource.indexOf('function applyDesign(design) {');
            const end = appSource.indexOf('\nfunction renderBeer(', start);
            assert.notEqual(start, -1, 'applyDesign() must exist');
            assert.notEqual(end, -1, 'renderBeer() anchor must exist after applyDesign()');
            return appSource.slice(start, end);
          }

          test('server design cannot overwrite Luxury VIP Space visual colors', () => {
            const source = applyDesignSource();

            assert.match(source, /state\.design = deepClone\(design\)/, 'server design data must still be stored');
            assert.match(source, /Object\.entries\(design\.sections \|\| \{\}\)/, 'section visibility must still be applied');
            assert.match(source, /design\.texts\?\.brand/, 'server-managed copy must still be applied');

            assert.doesNotMatch(source, /root\.style\.setProperty\(/, 'server payload must not rewrite CSS custom properties');
            assert.doesNotMatch(source, /const colors = design\.colors/, 'applyDesign must not consume legacy server colors');
            assert.match(source, /background: '#050609'/, 'fixed Luxury background must be preserved for platform chrome');
            assert.match(source, /header: '#06070a'/, 'fixed Luxury header must be preserved for platform chrome');
            assert.match(source, /setHeaderColor\(platformUiColors\.header\)/);
            assert.match(source, /setBackgroundColor\(platformUiColors\.background\)/);
          });
          EOF

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Verify clean diff
        run: git diff --check

      - name: Commit verified recovery patch
        shell: bash
        run: |
          git rm .github/workflows/recovery-self-patch.yml
          git add app.js test/luxury-design-lock.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Protect Luxury VIP Space from server color overrides'
          git push origin HEAD:recovery/clean-visual-vk-20260827
