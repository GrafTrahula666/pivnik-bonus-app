name: CRM beer inventory native PostgreSQL
on:
  pull_request:
    paths: ['admin-platform/**', '.github/workflows/beer-inventory-postgres.yml']
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: disposable-fixture-only
          POSTGRES_DB: codex_admin_test_beer
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: admin-platform
      - name: Two isolated databases, actual concurrent journal writes, read-only receipts
        working-directory: admin-platform
        env:
          BEER_INVENTORY_TEST_DATABASE_URL: postgres://postgres:disposable-fixture-only@127.0.0.1:5432/codex_admin_test_beer
        run: npx vitest run server/tests/beer-inventory-model.spec.ts server/tests/beer-inventory-postgres.spec.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run build && npm run lint
        working-directory: admin-platform
