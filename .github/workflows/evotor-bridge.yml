name: Evotor Bridge APK
on:
  push:
    branches: [feature/evotor-pivnik-bridge]
    paths: ['evotor-bridge/**', '.github/workflows/evotor-bridge.yml']
  pull_request:
    paths: ['evotor-bridge/**', '.github/workflows/evotor-bridge.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  EVOTOR_BRIDGE_DEBUG_HOME: ${{ github.workspace }}/.ci-evotor-bridge-home

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare debug signing home
        run: mkdir -p "$EVOTOR_BRIDGE_DEBUG_HOME/.android"

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.EVOTOR_BRIDGE_DEBUG_HOME }}/.android
          key: pivnik-evotor-bridge-debug-keystore-v1

      - name: Ensure debug signing key
        run: |
          KEYSTORE="$EVOTOR_BRIDGE_DEBUG_HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Pivnik Evotor Bridge Debug,O=Pivnik,C=RU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: evotor-bridge
        run: gradle -Duser.home="$EVOTOR_BRIDGE_DEBUG_HOME" :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: evotor-bridge
        run: gradle -Duser.home="$EVOTOR_BRIDGE_DEBUG_HOME" :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            evotor-bridge/app/build/outputs/apk/debug/app-debug.apk

      - name: Show package and app_uuid baked into the manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree --file AndroidManifest.xml \
            evotor-bridge/app/build/outputs/apk/debug/app-debug.apk \
            | grep -A2 -E 'package=|app_uuid' | grep -E 'package=|android:value'

      - uses: actions/upload-artifact@v4
        with:
          name: pivnik-evotor-bridge-debug-apk
          path: evotor-bridge/app/build/outputs/apk/debug/app-debug.apk
