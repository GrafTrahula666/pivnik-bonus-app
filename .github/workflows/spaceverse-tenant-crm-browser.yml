name: SPACEVERSE tenant CRM browser and HTTP

on:
  pull_request:
    paths:
      - 'customer-directory-repository.js'
      - 'customer-directory-repository.d.ts'
      - 'admin-platform/server/tenant-crm-read.ts'
      - 'admin-platform/server/tenant-crm-active-pilot-read.ts'
      - 'admin-platform/server/tests/tenant-crm-active-pilot.spec.ts'
      - 'admin-platform/server/config.ts'
      - 'admin-platform/server/router.ts'
      - 'admin-platform/server/tests/tenant-crm-http.spec.ts'
      - 'admin-platform/server/tests/tenant-crm-fixture.ts'
      - 'admin-platform/e2e/tenant-crm.spec.ts'
      - 'admin-platform/e2e/fixtures/tenant-crm-*.ts'
      - 'admin-platform/src/phaseC/TenantCustomerDirectory.tsx'
      - 'admin-platform/src/App.tsx'
      - 'admin-platform/src/phaseC/tenant-crm-contract.ts'
      - 'admin-platform/playwright.tenant-crm.config.ts'
      - '.github/workflows/spaceverse-tenant-crm-browser.yml'

permissions:
  contents: read

concurrency:
  group: tenant-crm-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped-crm:
    name: Signed HTTP and desktop/mobile on disposable PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codex_admin_test_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_admin_test_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPACEVERSE_TEST_NATIVE_POSTGRES_URL: postgres://crm_fixture:crm_fixture_ci_only@127.0.0.1:5432/codex_admin_test_crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-platform/package-lock.json
      - name: Install exact Business dependencies
        run: npm ci --prefix admin-platform
      - name: Create disposable fixture-only database role
        run: |
          node -e "const pg=require('./admin-platform/node_modules/pg');const p=new pg.Pool({connectionString:'postgres://postgres:postgres@127.0.0.1:5432/codex_admin_test_crm'});p.query(\"CREATE ROLE crm_fixture LOGIN PASSWORD 'crm_fixture_ci_only' CREATEDB\").then(()=>p.end()).catch(e=>{console.error(e.message);process.exitCode=1;p.end()})"
      - name: Tenant-scoped signed HTTP and native SQL checks
        run: npm test --prefix admin-platform -- server/tests/tenant-crm-http.spec.ts
      - name: Active-venue pilot signed HTTP and fail-closed source checks
        run: npm test --prefix admin-platform -- server/tests/tenant-crm-active-pilot.spec.ts
      - name: Install Chromium browser
        working-directory: admin-platform
        run: npx playwright install --with-deps chromium
      # Every invocation starts a fresh disposable fixture server and actor budget.
      # The real 30/min guard stays enabled; HTTP 429 is never suppressed.
      - name: Desktop Directory and filters on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'built panel reads and searches'
      - name: Desktop List error recovery on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'rate-limited customer list|server 500 on customer list'
      - name: Desktop Detail error recovery on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'malformed customer detail|expired session on customer detail|denied customer detail|missing customer detail 404|rate-limited customer detail|customer detail server failure'
      - name: Desktop Detail retry on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'failed customer detail can retry in place'
      # These fail-closed list regressions were previously excluded by the narrow greps.
      - name: Desktop malformed and denied list on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'malformed customer list|malformed list response|unauthorized customer list 401|permission denied on list refresh'
      - name: Desktop Pagination on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'all 355 customers remain'
      - name: Desktop Cross-owner isolation on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'changing venue clears customers'
      - name: Desktop Late-list isolation on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'late real customer response'
      - name: Desktop Late-list venue switch on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=desktop --grep 'late customer list from a closed venue'
      - name: Mobile Directory and filters on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'built panel reads and searches'
      - name: Mobile List error recovery on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'rate-limited customer list|server 500 on customer list'
      - name: Mobile Detail error recovery on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'malformed customer detail|expired session on customer detail|denied customer detail|missing customer detail 404|rate-limited customer detail|customer detail server failure'
      - name: Mobile Detail retry on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'failed customer detail can retry in place'
      - name: Mobile malformed and denied list on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'malformed customer list|malformed list response|unauthorized customer list 401|permission denied on list refresh'
      - name: Mobile Pagination on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'all 355 customers remain'
      - name: Mobile Cross-owner isolation on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'changing venue clears customers'
      - name: Mobile Late-list isolation on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'late real customer response'
      - name: Mobile Late-list venue switch on fresh fixture server
        working-directory: admin-platform
        run: npx playwright test -c playwright.tenant-crm.config.ts --project=mobile --grep 'late customer list from a closed venue'
      - name: Upload synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-crm-browser-failures
          path: admin-platform/test-results/
          if-no-files-found: ignore
          retention-days: 7
