name: Evotor Market native PostgreSQL

on:
  pull_request:
    paths:
      - 'admin-platform/server/evotor-market.ts'
      - 'admin-platform/server/tests/evotor-market-postgres.spec.ts'
      - 'admin-platform/admin-migrations/018_evotor_market_inbox.sql'
      - 'admin-platform/admin-migrations/019_evotor_market_reconciliation.sql'
      - '.github/workflows/evotor-market-native-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-postgres:
    name: Callback inbox / PostgreSQL 16 (disposable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codex_admin_test_evotor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_admin_test_evotor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-platform/package-lock.json
      - name: Install exact Business dependencies
        run: npm ci --prefix admin-platform
      - name: Native PostgreSQL callback and migration regression
        env:
          ADMIN_INTEGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/codex_admin_test_evotor
        run: npm test --prefix admin-platform -- server/tests/evotor-market-postgres.spec.ts
