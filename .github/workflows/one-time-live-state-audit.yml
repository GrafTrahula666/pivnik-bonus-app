name: One-time Pivnik launch content verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/restore-live-state'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      APP_URL: https://pivnik-bonus-app-production-df60.up.railway.app
      OWNER_ID: '6076253753'
      OWNER_USERNAME: OriginalToPG
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Authenticate owner and verify all read-only launch data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const botToken=process.env.TELEGRAM_BOT_TOKEN;
          const appUrl=process.env.APP_URL;
          const user={id:Number(process.env.OWNER_ID),first_name:'TopG',username:process.env.OWNER_USERNAME,language_code:'ru'};
          const params=new URLSearchParams({auth_date:String(Math.floor(Date.now()/1000)),query_id:'AAE_PIVNIK_LAUNCH_CONTENT_20260819',user:JSON.stringify(user)});
          const d=[...params.entries()].sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>`${k}=${v}`).join('\n');
          const secret=crypto.createHmac('sha256','WebAppData').update(botToken).digest();
          params.set('hash',crypto.createHmac('sha256',secret).update(d).digest('hex'));
          const auth=await fetch(`${appUrl}/api/auth`,{method:'POST',headers:{'content-type':'application/json','x-pivnik-platform':'telegram'},body:JSON.stringify({platform:'telegram',initData:params.toString()})});
          const a=await auth.json();
          if(!auth.ok||!a.token) throw new Error(`auth ${auth.status} ${JSON.stringify(a)}`);
          const headers={authorization:`Bearer ${a.token}`,'x-pivnik-platform':'telegram'};
          const paths=[
            '/api/bootstrap','/api/admin/content','/api/admin/summary','/api/admin/shift',
            '/api/admin/promotions','/api/admin/shop-items','/api/shop/catalog',
            '/api/leaderboard/monthly','/api/me/transactions','/api/achievements',
            '/api/shift/current','/api/wheel/status'
          ];
          const results={};
          for(const path of paths){
            const r=await fetch(appUrl+path,{headers});
            const ct=r.headers.get('content-type')||'';
            const body=ct.includes('json')?await r.json():await r.text();
            results[path]={status:r.status,body};
            console.log(`ENDPOINT ${path} HTTP=${r.status} BODY=${JSON.stringify(body).slice(0,16000)}`);
          }
          const promos=results['/api/admin/promotions'];
          if(promos.status!==200) throw new Error('Admin promotions unavailable');
          const shop=results['/api/admin/shop-items'];
          if(shop.status!==200) throw new Error('Admin shop unavailable');
          const bootstrap=results['/api/bootstrap'];
          if(bootstrap.status!==200) throw new Error('Bootstrap unavailable');
          const wheel=results['/api/wheel/status'];
          if(wheel.status!==200 || wheel.body?.enabled!==true) throw new Error('Wheel unavailable');
          console.log('SEEDED_LAUNCH_CONTENT_OK=true');
          NODE
