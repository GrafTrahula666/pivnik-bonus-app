name: One-time Pivnik live state audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/restore-live-state'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PROJECT_ID: 20a942f9-3164-484a-a6f1-565439e38705
      ENVIRONMENT_ID: cdd9d26c-2aab-45d9-95ed-ef487fafaa8f
      WORKSPACE_ID: fb7b2ccc-bf39-4fcb-81df-b33235cc4717
      APP_SERVICE: pivnik-bonus-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install --global @railway/cli@latest
      - name: Link live Pivnik service
        run: railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$APP_SERVICE" --workspace "$WORKSPACE_ID" --json
      - name: Inspect current database users and state
        shell: bash
        run: |
          set -euo pipefail
          railway run -s "$APP_SERVICE" -e "$ENVIRONMENT_ID" node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const c = new Client({ connectionString: process.env.DATABASE_URL, ssl: String(process.env.DATABASE_URL||'').includes('railway.internal') ? false : { rejectUnauthorized:false } });
          await c.connect();
          const users = await c.query(`
            SELECT id, telegram_id, vk_id, username, first_name, last_name, role,
                   unlimited_bonus, beta_number, profile_frame, created_at, updated_at
            FROM users
            WHERE merged_into_user_id IS NULL
            ORDER BY created_at DESC
            LIMIT 50
          `);
          console.log('CURRENT_USERS='+JSON.stringify(users.rows,null,2));
          const counts = {};
          for (const table of ['users','wallets','transactions','beer_loyalty','achievements','wheel_spins','staff']) {
            try { const r=await c.query(`SELECT COUNT(*)::int AS n FROM ${table}`); counts[table]=r.rows[0].n; }
            catch { counts[table]='missing'; }
          }
          console.log('TABLE_COUNTS='+JSON.stringify(counts));
          const wallets = await c.query(`SELECT w.user_id,w.balance,u.telegram_id,u.username,u.first_name,u.role FROM wallets w JOIN users u ON u.id=w.user_id ORDER BY w.balance DESC LIMIT 30`);
          console.log('WALLETS='+JSON.stringify(wallets.rows,null,2));
          await c.end();
          NODE
      - name: Inspect recent Telegram updates for account IDs
        shell: bash
        run: |
          set -euo pipefail
          reply=$(curl --fail --silent --show-error --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100&timeout=0")
          node -e '
            const x=JSON.parse(process.argv[1]);
            const rows=[];
            for(const u of x.result||[]){
              const m=u.message||u.edited_message||u.callback_query?.message;
              const from=u.message?.from||u.edited_message?.from||u.callback_query?.from;
              if(!from) continue;
              rows.push({update_id:u.update_id,id:from.id,username:from.username||null,first_name:from.first_name||null,last_name:from.last_name||null,text:m?.text||u.callback_query?.data||null,date:m?.date||null});
            }
            console.log("TELEGRAM_UPDATES="+JSON.stringify(rows.slice(-50),null,2));
          ' "$reply"
