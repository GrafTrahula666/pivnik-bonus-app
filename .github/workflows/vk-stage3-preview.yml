name: VK Stage 3 DEV preview

on:
  push:
    branches:
      - ui/black-frosted-surfaces-stage3

permissions:
  contents: read

jobs:
  deploy-vk-dev-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Stage 3 commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build VK native static bundle for DEV preview
        env:
          PIVNIK_VK_API_BASE: https://139.100.238.159.nip.io
        run: npm run build:vk-hosting

      - name: Verify DEV preview bundle
        shell: bash
        run: |
          test -f vk-hosting-build/index.html
          test -f vk-hosting-build/vk-platform.js
          grep -q '__PIVNIK_VK_API_BASE__' vk-hosting-build/index.html
          grep -q 'resolveGatewayInput' vk-hosting-build/vk-platform.js
          ! grep -q 'telegram.org/js/telegram-web-app.js' vk-hosting-build/index.html
          grep -q 'black-frosted-surfaces.css' vk-hosting-build/index.html

      - name: Deploy Stage 3 to VK Mini Apps Hosting DEV only
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: dev
          CI_URLS: "true"
        shell: bash
        run: |
          test -n "$MINI_APPS_ACCESS_TOKEN"
          npx -y @vkontakte/vk-miniapps-deploy@1.0.2
