name: Materialize proven runtime retirement candidates once

on:
  push:
    branches:
      - audit/spaceverse-architecture-20260910

permissions:
  contents: write

jobs:
  materialize-proven-candidates:
    if: github.event.head_commit.message == 'Stage proven runtime patch retirement'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply owner cancellation patch to raw canonical source
        run: node scripts/apply-owner-unlimited-cancel.mjs

      - name: Apply release polish patch to raw canonical source
        run: node scripts/apply-release-polish.mjs

      - name: Verify canonical markers
        run: |
          grep -Fq '// V21 · owner unlimited cancellation' server.js
          grep -Fq '/* V19.3 · release polish */' styles.css

      - name: Verify patch diff integrity
        run: git diff --check -- server.js styles.css

      - name: Verify patched server syntax
        run: node --check server.js

      - name: Commit canonicalized sources only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server.js styles.css
          if git diff --cached --quiet; then
            echo 'No canonical source changes to commit.'
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          test "$changed" = $'server.js\nstyles.css' || {
            echo "Unexpected staged files:"
            printf '%s\n' "$changed"
            exit 1
          }
          git commit -m 'Canonicalize proven runtime patches'
          git push origin HEAD:audit/spaceverse-architecture-20260910
