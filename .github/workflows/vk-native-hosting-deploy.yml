name: VK native hosting deploy

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      api_base:
        description: "Public HTTPS VK API gateway URL"
        required: true
        type: string
      environment:
        description: "VK Hosting environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production
      confirm:
        description: "For production type DEPLOY_VK_PRODUCTION"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-dev-from-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/vk-native-hosting-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build VK native static bundle for Selectel gateway
        env:
          PIVNIK_VK_API_BASE: https://139.100.238.159.nip.io
        run: npm run build:vk-hosting

      - name: Verify bundle contains VK runtime and gateway routing
        shell: bash
        run: |
          test -f vk-hosting-build/index.html
          test -f vk-hosting-build/vk-platform.js
          grep -q '__PIVNIK_VK_API_BASE__' vk-hosting-build/index.html
          grep -q 'resolveGatewayInput' vk-hosting-build/vk-platform.js
          ! grep -q 'telegram.org/js/telegram-web-app.js' vk-hosting-build/index.html

      - name: Deploy DEV only to VK Mini Apps Hosting
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: dev
          CI_URLS: "true"
        shell: bash
        run: |
          if [ -z "$MINI_APPS_ACCESS_TOKEN" ]; then
            echo "GitHub secret VK_MINI_APPS_ACCESS_TOKEN is not configured."
            exit 1
          fi
          npx -y @vkontakte/vk-miniapps-deploy@1.0.2

  deploy-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard production deployment
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ inputs.confirm }}" != "DEPLOY_VK_PRODUCTION" ]; then
            echo "Production confirmation is missing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build VK native static bundle
        env:
          PIVNIK_VK_API_BASE: ${{ inputs.api_base }}
        run: npm run build:vk-hosting

      - name: Verify bundle contains VK runtime and gateway routing
        shell: bash
        run: |
          test -f vk-hosting-build/index.html
          test -f vk-hosting-build/vk-platform.js
          grep -q '__PIVNIK_VK_API_BASE__' vk-hosting-build/index.html
          grep -q 'resolveGatewayInput' vk-hosting-build/vk-platform.js
          ! grep -q 'telegram.org/js/telegram-web-app.js' vk-hosting-build/index.html

      - name: Deploy to VK Mini Apps Hosting
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: ${{ inputs.environment }}
          CI_URLS: "true"
        shell: bash
        run: |
          if [ -z "$MINI_APPS_ACCESS_TOKEN" ]; then
            echo "GitHub secret VK_MINI_APPS_ACCESS_TOKEN is not configured."
            exit 1
          fi
          npx -y @vkontakte/vk-miniapps-deploy@1.0.2
