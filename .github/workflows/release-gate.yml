name: Pivnik source export

on:
  push:
    branches:
      - 'audit/source-export-20260825'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact production main commit
        uses: actions/checkout@v4
        with:
          ref: d1c32f425c23756d8831b555d137d141e3d1b5ca

      - name: Count source lines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict

          root = Path('.')
          code_exts = {'.js','.mjs','.cjs','.html','.css','.sql','.sh'}
          text_exts = code_exts | {'.json','.md','.yml','.yaml','.txt','.env','.example'}
          excluded = {'.git','node_modules'}
          by_ext = defaultdict(lambda: [0,0,0])
          code_files = code_lines = code_nonblank = 0
          text_files = text_lines = text_nonblank = 0

          for p in root.rglob('*'):
              if not p.is_file() or any(part in excluded for part in p.parts):
                  continue
              ext = p.suffix.lower()
              if p.name == '.env.example': ext = '.env'
              if ext not in text_exts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              lines = s.splitlines()
              nonblank = sum(bool(x.strip()) for x in lines)
              text_files += 1; text_lines += len(lines); text_nonblank += nonblank
              by_ext[ext][0] += 1; by_ext[ext][1] += len(lines); by_ext[ext][2] += nonblank
              if ext in code_exts:
                  code_files += 1; code_lines += len(lines); code_nonblank += nonblank

          with open('LINE_COUNT.txt','w',encoding='utf-8') as f:
              f.write('PIVNIK source line count\n')
              f.write('Commit: d1c32f425c23756d8831b555d137d141e3d1b5ca\n\n')
              f.write(f'PROGRAM CODE: {code_lines} physical lines, {code_nonblank} nonblank lines, {code_files} files\n')
              f.write(f'ALL TEXT SOURCE: {text_lines} physical lines, {text_nonblank} nonblank lines, {text_files} files\n\n')
              f.write('Breakdown:\n')
              for ext,(files,lines,nonblank) in sorted(by_ext.items(), key=lambda kv:(-kv[1][1],kv[0])):
                  f.write(f'{ext:8} files={files:3} lines={lines:7} nonblank={nonblank:7}\n')
          print(Path('LINE_COUNT.txt').read_text())
          PY

      - name: Package exact source snapshot
        shell: bash
        run: |
          rm -f pivnik-bonus-app-main-d1c32f4.zip
          zip -qr pivnik-bonus-app-main-d1c32f4.zip . -x '.git/*' 'pivnik-bonus-app-main-d1c32f4.zip'
          unzip -t pivnik-bonus-app-main-d1c32f4.zip >/dev/null
          ls -lh pivnik-bonus-app-main-d1c32f4.zip LINE_COUNT.txt

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pivnik-source-main-d1c32f4
          path: |
            pivnik-bonus-app-main-d1c32f4.zip
            LINE_COUNT.txt
          if-no-files-found: error
          retention-days: 1
