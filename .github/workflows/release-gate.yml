name: Pivnik release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'audit/**'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest

      - name: Materialize release sources
        run: npm run materialize

      - name: Verify materialization is idempotent
        run: npm run materialize

      - name: Check JavaScript syntax
        run: npm run check

      - name: Audit Railway production safely
        continue-on-error: true
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          echo '=== SAFE VARIABLE AUDIT ==='
          npm run railway:audit || true
          echo '=== VOLUMES ==='
          railway volume list --json || true
          echo '=== PUBLIC VOLUME INSTANCE SCHEMA ==='
          node scripts/railway-volume-instance-introspect.mjs || true
          echo '=== DATABASE AUDIT ==='
          node scripts/railway-database-audit.mjs || true

      - name: Create and lock pre-unification Railway backups
        continue-on-error: true
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          node --check scripts/railway-create-release-backups.mjs
          node scripts/railway-create-release-backups.mjs

      - name: Check backup and restore scripts
        run: bash -n ops/backup-postgres.sh ops/restore-postgres.sh

      - name: Run automated tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run
