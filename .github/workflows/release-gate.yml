name: Pivnik release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'audit/**'
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character main commit SHA to deploy (not a PR SHA)'
        type: string
        required: true
      release_confirm:
        description: 'Explicit production release approval'
        type: choice
        required: true
        options:
          - CANCEL
          - DEPLOY_PIVNIK_PRODUCTION
        default: CANCEL

concurrency:
  # Keep release checks serialized per ref and never cancel any queued run.
  # Railway Wait for CI may ignore cancelled workflows when another CI passes.
  # Do not give main unique concurrent groups: the workflow includes a deploy.
  group: release-gate-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Immutable per-attempt dispatch inputs for later authenticated artifact
      # verification. This is evidence, NOT release authorization by itself.
      - name: Record manual dispatch inputs for release evidence
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ATTEST_RUN_ID: ${{ github.run_id }}
          ATTEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          ATTEST_SHA: ${{ github.sha }}
          ATTEST_REF: ${{ github.ref }}
          ATTEST_RELEASE_SHA: ${{ inputs.release_sha }}
          ATTEST_RELEASE_CONFIRM: ${{ inputs.release_confirm }}
        run: |
          node --input-type=module -e '
            import { mkdirSync, writeFileSync } from "node:fs";
            const env = process.env;
            if (!/^[0-9a-f]{40}$/i.test(env.ATTEST_SHA)) process.exit(1);
            if (!/^[0-9a-f]{40}$/i.test(env.ATTEST_RELEASE_SHA)) process.exit(1);
            if (!/^[1-9][0-9]*$/.test(env.ATTEST_RUN_ID) ||
                !/^[1-9][0-9]*$/.test(env.ATTEST_RUN_ATTEMPT)) process.exit(1);
            if (!["CANCEL", "DEPLOY_PIVNIK_PRODUCTION"].includes(env.ATTEST_RELEASE_CONFIRM)) process.exit(1);
            mkdirSync("artifacts/release-dispatch", { recursive: true });
            writeFileSync("artifacts/release-dispatch/dispatch.json", JSON.stringify({
              schemaVersion: 1,
              repository: "GrafTrahula666/pivnik-bonus-app",
              event: "workflow_dispatch",
              runId: Number(env.ATTEST_RUN_ID),
              runAttempt: Number(env.ATTEST_RUN_ATTEMPT),
              sha: env.ATTEST_SHA.toLowerCase(),
              ref: env.ATTEST_REF,
              releaseSha: env.ATTEST_RELEASE_SHA.toLowerCase(),
              releaseConfirm: env.ATTEST_RELEASE_CONFIRM,
            }) + String.fromCharCode(10));
          '

      - name: Upload manual dispatch evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-dispatch-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.release_confirm }}-${{ inputs.release_sha }}
          path: artifacts/release-dispatch/dispatch.json
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install exact Business dependencies
        run: npm ci --prefix admin-platform

      - name: Audit canonical runtime retirement evidence
        env:
          RUNTIME_RETIREMENT_REPORT_DIR: artifacts/runtime-retirement
          RUNTIME_RETIREMENT_PHASE: canonical
        run: npm run audit:runtime-retirement

      - name: Verify canonical VK startup survives prestart and materialization
        run: npm run verify:vk-startup-parity

      - name: Materialize release sources
        run: npm run materialize

      - name: Verify materialized release state
        run: test -f .pivnik-materialized

      - name: Verify release materialization is idempotent
        shell: bash
        run: |
          before="$(git diff --binary -- . ':(exclude).pivnik-materialized' ':(exclude)artifacts/runtime-retirement' | sha256sum | cut -d' ' -f1)"
          npm run materialize
          after="$(git diff --binary -- . ':(exclude).pivnik-materialized' ':(exclude)artifacts/runtime-retirement' | sha256sum | cut -d' ' -f1)"
          if [ "$before" != "$after" ]; then
            echo "::error title=Non-idempotent release materialization::A second materialization changed the prepared release sources."
            git diff --stat -- . ':(exclude).pivnik-materialized' ':(exclude)artifacts/runtime-retirement'
            exit 1
          fi

      - name: Audit materialized runtime retirement evidence
        env:
          RUNTIME_RETIREMENT_REPORT_DIR: artifacts/runtime-retirement
          RUNTIME_RETIREMENT_PHASE: materialized
        run: npm run audit:runtime-retirement

      - name: Upload runtime retirement audit evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runtime-retirement-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-retirement/
          if-no-files-found: error
          retention-days: 14

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check backup and restore scripts
        run: bash -n ops/backup-postgres.sh ops/restore-postgres.sh

      - name: Run automated tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/pivnik-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Failing test diagnostics"
            details=$(awk '/^not ok 13 - Gateway render:|^not ok 14 - VK Railway service/{capture=1} capture{print}' /tmp/pivnik-tests.log | tail -c 14000)
            safe=${details//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=Gateway test diagnostics::$safe"
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Run Business tests with Vitest
        run: npm test --prefix admin-platform

      - name: Audit Business dependencies
        run: npm audit --prefix admin-platform --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify existing production secrets without changing them
        if: >-
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/audit/final-release-gate-20260804' || github.ref == 'refs/heads/main')) ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.head_ref == 'audit/final-release-gate-20260804') ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.release_sha == github.sha &&
          inputs.release_confirm == 'DEPLOY_PIVNIK_PRODUCTION')
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PRODUCTION_READ_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.RAILWAY_PRODUCTION_READ_TOKEN || '' }}
        run: |
          node --check scripts/railway-ensure-production-secrets.mjs
          node scripts/railway-ensure-production-secrets.mjs --check

      - name: Unify VK legacy database into canonical production
        if: >-
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/audit/final-release-gate-20260804') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.head_ref == 'audit/final-release-gate-20260804')
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PIVNIK_UNIFY_CONFIRM: UNIFY_PIVNIK_20260804
        run: |
          node --check scripts/railway-unify-production-databases.mjs
          node scripts/railway-unify-production-databases.mjs

      - name: Restore Anna frame and reconcile existing linked consent
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'hotfix/anna-frame-consent-persistence-20260806'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PIVNIK_ANNA_CONSENT_REPAIR_CONFIRM: REPAIR_ANNA_FRAME_AND_CONSENT_20260806
        run: node scripts/railway-repair-anna-frame-and-consent.mjs

      - name: Deploy exact commit and verify both production services
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.release_sha == github.sha &&
          inputs.release_confirm == 'DEPLOY_PIVNIK_PRODUCTION'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Fail closed if main moved while a manually approved release waited.
          current_main="$(git ls-remote --heads origin main | cut -f1)"
          if [ -z "$current_main" ] || [ "$current_main" != "$RELEASE_COMMIT_SHA" ]; then
            echo "::error title=Stale production release::origin/main changed or could not be verified; no deployment attempted."
            exit 1
          fi
          node scripts/railway-deploy-and-verify-production.mjs

      - name: Probe production documents and public endpoints
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.release_sha == github.sha &&
          inputs.release_confirm == 'DEPLOY_PIVNIK_PRODUCTION'
        run: node scripts/probe-current-production.mjs

      - name: Verify separate Telegram and VK production accounts
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.release_sha == github.sha &&
          inputs.release_confirm == 'DEPLOY_PIVNIK_PRODUCTION'
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/verify-platform-separation-production.mjs

      - name: Verify signed Telegram and VK production sessions
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.release_sha == github.sha &&
          inputs.release_confirm == 'DEPLOY_PIVNIK_PRODUCTION'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/railway-production-auth-smoke.mjs
