name: Pivnik release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'audit/**'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Materialize release sources
        run: npm run materialize

      - name: Verify materialization is idempotent
        run: npm run materialize

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check backup and restore scripts
        run: bash -n ops/backup-postgres.sh ops/restore-postgres.sh

      - name: Run automated tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Unify VK legacy database into canonical production
        if: github.event_name == 'push' && (github.ref == 'refs/heads/audit/final-release-gate-20260804' || github.ref == 'refs/heads/main')
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PIVNIK_UNIFY_CONFIRM: UNIFY_PIVNIK_20260804
        run: |
          node --check scripts/railway-unify-production-databases.mjs
          node scripts/railway-unify-production-databases.mjs
