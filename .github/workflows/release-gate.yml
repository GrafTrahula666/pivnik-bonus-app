name: Pivnik release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'audit/**'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Materialize release sources
        run: npm run materialize

      - name: Verify materialized release state
        run: test -f .pivnik-materialized

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check backup and restore scripts
        run: bash -n ops/backup-postgres.sh ops/restore-postgres.sh

      - name: Run automated tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/pivnik-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Failing test diagnostics"
            details=$(awk '
              /^not ok [0-9]+ - / { capture=1 }
              capture { print }
              capture && /^  \.\.\.$/ { capture=0 }
            ' /tmp/pivnik-tests.log | tail -c 14000)
            if [ -z "$details" ]; then
              details=$(tail -c 14000 /tmp/pivnik-tests.log)
            fi
            safe=${details//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=Gateway test diagnostics::$safe"
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Deploy exact commit and verify both production services
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          TELEGRAM_APP_URL: ${{ vars.TELEGRAM_APP_URL || 'https://pivnik-bonus-app-production-df60.up.railway.app' }}
          VK_APP_URL: ${{ vars.VK_APP_URL || 'https://pivnik-vk-test-production-b6b5.up.railway.app' }}
        run: node scripts/railway-deploy-and-verify-production.mjs

      - name: Verify separate Telegram and VK production accounts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          TELEGRAM_APP_URL: ${{ vars.TELEGRAM_APP_URL || 'https://pivnik-bonus-app-production-df60.up.railway.app' }}
          VK_APP_URL: ${{ vars.VK_APP_URL || 'https://pivnik-vk-test-production-b6b5.up.railway.app' }}
        run: node scripts/verify-platform-separation-production.mjs
