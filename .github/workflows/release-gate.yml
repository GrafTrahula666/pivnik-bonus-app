name: Pivnik release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'audit/**'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Syntax, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize critical transaction persistence wiring once
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/audit/spaceverse-architecture-20260910' &&
          github.event.head_commit.message == 'Wire critical transaction persistence'
        shell: bash
        run: |
          node --check scripts/wire-critical-transaction-persistence-once.mjs
          node scripts/wire-critical-transaction-persistence-once.mjs
          node --check server.js
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            server.js \
            test/beer-gift-transaction-persistence.test.js \
            test/beer-gift-transaction-wiring-safety.test.js \
            test/staff-transaction-persistence.test.js \
            test/staff-transaction-wiring-safety.test.js | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed by critical wiring:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js test/beer-gift-transaction-persistence.test.js test/beer-gift-transaction-wiring-safety.test.js test/staff-transaction-persistence.test.js test/staff-transaction-wiring-safety.test.js
          git commit -m "Wire staff and beer gift persistence"
          git push origin HEAD:audit/spaceverse-architecture-20260910

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit canonical runtime retirement evidence
        env:
          RUNTIME_RETIREMENT_REPORT_DIR: artifacts/runtime-retirement
          RUNTIME_RETIREMENT_PHASE: canonical
        run: npm run audit:runtime-retirement

      - name: Materialize release sources
        run: npm run materialize

      - name: Verify materialized release state
        run: test -f .pivnik-materialized

      - name: Verify release materialization is idempotent
        shell: bash
        run: |
          before="$(git diff --binary -- . ':(exclude).pivnik-materialized' ':(exclude)artifacts/runtime-retirement' | sha256sum | cut -d' ' -f1)"
          npm run materialize
          after="$(git diff --binary -- . ':(exclude).pivnik-materialized' ':(exclude)artifacts/runtime-retirement' | sha256sum | cut -d' ' -f1)"
          if [ "$before" != "$after" ]; then
            echo "::error title=Non-idempotent release materialization::A second materialization changed the prepared release sources."
            git diff --stat -- . ':(exclude).pivnik-materialized' ':(exclude)artifacts/runtime-retirement'
            exit 1
          fi

      - name: Audit materialized runtime retirement evidence
        env:
          RUNTIME_RETIREMENT_REPORT_DIR: artifacts/runtime-retirement
          RUNTIME_RETIREMENT_PHASE: materialized
        run: npm run audit:runtime-retirement

      - name: Upload runtime retirement audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-retirement-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-retirement/
          if-no-files-found: error
          retention-days: 14

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check backup and restore scripts
        run: bash -n ops/backup-postgres.sh ops/restore-postgres.sh

      - name: Run automated tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/pivnik-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Failing test diagnostics"
            details=$(awk '/^not ok 13 - Gateway render:|^not ok 14 - VK Railway service/{capture=1} capture{print}' /tmp/pivnik-tests.log | tail -c 14000)
            safe=${details//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=Gateway test diagnostics::$safe"
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Synchronize strong production secrets
        if: >-
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/audit/final-release-gate-20260804' || github.ref == 'refs/heads/main')) ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.head_ref == 'audit/final-release-gate-20260804')
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          node --check scripts/railway-ensure-production-secrets.mjs
          node scripts/railway-ensure-production-secrets.mjs

      - name: Unify VK legacy database into canonical production
        if: >-
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/audit/final-release-gate-20260804') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.head_ref == 'audit/final-release-gate-20260804')
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PIVNIK_UNIFY_CONFIRM: UNIFY_PIVNIK_20260804
        run: |
          node --check scripts/railway-unify-production-databases.mjs
          node scripts/railway-unify-production-databases.mjs

      - name: Restore Anna frame and reconcile existing linked consent
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'hotfix/anna-frame-consent-persistence-20260806'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PIVNIK_ANNA_CONSENT_REPAIR_CONFIRM: REPAIR_ANNA_FRAME_AND_CONSENT_20260806
        run: node scripts/railway-repair-anna-frame-and-consent.mjs

      - name: Deploy exact commit and verify both production services
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/railway-deploy-and-verify-production.mjs

      - name: Probe production documents and public endpoints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/probe-current-production.mjs

      - name: Verify separate Telegram and VK production accounts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/verify-platform-separation-production.mjs

      - name: Verify signed Telegram and VK production sessions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/railway-production-auth-smoke.mjs
