name: Pivnik release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'audit/**'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest

      - name: Materialize release sources
        run: npm run materialize

      - name: Verify materialization is idempotent
        run: npm run materialize

      - name: Check JavaScript syntax
        run: npm run check

      - name: Audit Railway production safely
        continue-on-error: true
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          echo '=== SAFE VARIABLE AUDIT ==='
          npm run railway:audit || true
          echo '=== VOLUMES ==='
          railway volume list --json || true
          echo '=== BACKUP API SCHEMA ==='
          npm run railway:backup-schema || true
          echo '=== TELEGRAM DATABASE AUDIT ==='
          railway run --project 9a940d7a-b0b0-4893-a90d-1b0a8b6850d5 --environment aa461df9-1dbb-4000-8906-f13dd8008a6f --service 4c4d5f11-e3af-4ffb-8ae9-21a8854b6c90 node scripts/verify-production-database.mjs || true
          echo '=== VK DATABASE AUDIT ==='
          railway run --project 9a940d7a-b0b0-4893-a90d-1b0a8b6850d5 --environment aa461df9-1dbb-4000-8906-f13dd8008a6f --service 61352beb-78fe-4293-939c-c1f93294b204 node scripts/verify-production-database.mjs || true

      - name: Check backup and restore scripts
        run: bash -n ops/backup-postgres.sh ops/restore-postgres.sh

      - name: Run automated tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run
