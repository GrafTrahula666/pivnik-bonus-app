name: Pivnik release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'audit/**'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Detect Railway automation credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          TELEGRAM_SERVICE_ID: ${{ vars.TELEGRAM_SERVICE_ID }}
          VK_SERVICE_ID: ${{ vars.VK_SERVICE_ID }}
          TELEGRAM_APP_URL: ${{ vars.TELEGRAM_APP_URL }}
          VK_APP_URL: ${{ vars.VK_APP_URL }}
        run: |
          node - <<'NODE'
          const keys = [
            'RAILWAY_TOKEN',
            'RAILWAY_API_TOKEN',
            'RAILWAY_PROJECT_TOKEN',
            'RAILWAY_PROJECT_ID',
            'RAILWAY_ENVIRONMENT_ID',
            'TELEGRAM_SERVICE_ID',
            'VK_SERVICE_ID',
            'TELEGRAM_APP_URL',
            'VK_APP_URL'
          ];
          for (const key of keys) {
            const value = String(process.env[key] || '');
            console.log(`${key}: ${value ? `configured (${value.length} chars)` : 'not configured'}`);
          }
          NODE

      - name: Probe current Railway production
        continue-on-error: true
        run: node scripts/probe-current-production.mjs

      - name: Materialize release sources
        run: npm run materialize

      - name: Verify materialization is idempotent
        run: npm run materialize

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check backup and restore scripts
        run: bash -n ops/backup-postgres.sh ops/restore-postgres.sh

      - name: Run automated tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run
