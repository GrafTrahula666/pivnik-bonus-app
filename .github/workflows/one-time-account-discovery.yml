name: One-time Railway account discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/account-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Query Railway projects by authenticated user
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          node - <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=process.env.RAILWAY_API_TOKEN;
          async function gql(query, variables={}) {
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query,variables})});
            const x=await r.json().catch(()=>({}));
            if(x.errors?.length) console.log('ERRORS='+x.errors.map(e=>e.message).join(' | '));
            return x.data;
          }
          const me=await gql('query { me { id email name } }');
          console.log('ME='+JSON.stringify(me?.me||null));
          const uid=me?.me?.id;
          if(uid){
            const all=await gql(`query($uid:String!){ projects(first:100, includeDeleted:true, userId:$uid) { edges { node { id name createdAt updatedAt deletedAt workspace { id name } services { edges { node { id name } } } } } } }`,{uid});
            console.log('USER_PROJECTS_WITH_DELETED='+JSON.stringify(all?.projects?.edges?.map(e=>e.node)||[],null,2));
          }
          const current=await gql(`query { projects(first:100, includeDeleted:true, workspaceId:"fb7b2ccc-bf39-4fcb-81df-b33235cc4717") { edges { node { id name deletedAt } } } }`);
          console.log('CURRENT_WS_WITH_DELETED='+JSON.stringify(current?.projects?.edges?.map(e=>e.node)||[],null,2));
          NODE
