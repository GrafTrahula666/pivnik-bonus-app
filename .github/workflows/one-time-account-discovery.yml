name: One-time Railway account discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/account-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Verify account token identity
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: railway whoami
      - name: Inspect Railway recovery candidates
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          node - <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=process.env.RAILWAY_API_TOKEN;
          async function gql(query, variables={}) {
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query,variables})});
            const x=await r.json().catch(()=>({}));
            if(x.errors?.length) console.log('ERRORS='+x.errors.map(e=>e.message).join(' | '));
            return x.data;
          }
          function shape(t){ if(!t)return null; return {kind:t.kind,name:t.name,ofType:t.ofType?shape(t.ofType):null}; }
          const data=await gql(`query {
            q: __type(name:"Query") { fields(includeDeprecated:true) { name description args { name description defaultValue type { kind name ofType { kind name ofType { kind name } } } } type { kind name ofType { kind name ofType { kind name } } } } }
            m: __type(name:"Mutation") { fields(includeDeprecated:true) { name description args { name description defaultValue type { kind name ofType { kind name ofType { kind name } } } } type { kind name ofType { kind name ofType { kind name } } } } }
          }`);
          const wantedQ=new Set(['externalWorkspaces','projectsByIds','projects','workspace','workspaceByCode']);
          const wantedM=new Set(['projectClaim','projectTransfer','projectTransferInitiate','projectTransferConfirm','projectTransferToTeam']);
          const clean=f=>({name:f.name,description:f.description,args:f.args.map(a=>({name:a.name,description:a.description,defaultValue:a.defaultValue,type:shape(a.type)})),type:shape(f.type)});
          console.log('QUERY_SCHEMA='+JSON.stringify(data?.q?.fields?.filter(f=>wantedQ.has(f.name)).map(clean)||[],null,2));
          console.log('MUTATION_SCHEMA='+JSON.stringify(data?.m?.fields?.filter(f=>wantedM.has(f.name)).map(clean)||[],null,2));
          const ext=await gql('query { externalWorkspaces { id name } }');
          console.log('EXTERNAL_WORKSPACES='+JSON.stringify(ext?.externalWorkspaces??null,null,2));
          const byIds=await gql('query($ids:[String!]!){ projectsByIds(ids:$ids){ id name deletedAt workspace { id name } } }',{ids:['9a940d7a-b0b0-4893-a90d-1b0a8b6850d5']});
          console.log('PROJECTS_BY_IDS='+JSON.stringify(byIds?.projectsByIds??null,null,2));
          NODE
