name: One-time Railway account discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/account-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Claim legacy Pivnik project into current Hobby workspace if Railway permits it
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          node - <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=process.env.RAILWAY_API_TOKEN;
          async function gql(query, variables={}) {
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query,variables})});
            const x=await r.json().catch(()=>({}));
            if(x.errors?.length) console.log('ERRORS='+x.errors.map(e=>e.message).join(' | '));
            return x.data;
          }
          const legacyId='9a940d7a-b0b0-4893-a90d-1b0a8b6850d5';
          const workspaceId='fb7b2ccc-bf39-4fcb-81df-b33235cc4717';
          const claimed=await gql('mutation($id:String!,$workspaceId:String!){ projectClaim(id:$id,workspaceId:$workspaceId){ id name deletedAt workspace { id name } services { edges { node { id name } } } environments { edges { node { id name } } } } }',{id:legacyId,workspaceId});
          console.log('CLAIM_RESULT='+JSON.stringify(claimed?.projectClaim??null,null,2));
          const projects=await gql('query($workspaceId:String!){ projects(first:100,includeDeleted:true,workspaceId:$workspaceId){ edges { node { id name deletedAt services { edges { node { id name } } } } } } }',{workspaceId});
          console.log('CURRENT_WORKSPACE_PROJECTS='+JSON.stringify(projects?.projects?.edges?.map(e=>e.node)||[],null,2));
          NODE
