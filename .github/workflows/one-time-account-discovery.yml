name: One-time Railway account discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/account-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Verify account token identity
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: railway whoami
      - name: List visible Railway projects
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: railway list --json
      - name: Inspect project and deletion related Railway API fields
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { q: __type(name: \"Query\") { fields { name args { name type { kind name ofType { kind name } } } } } m: __type(name: \"Mutation\") { fields { name args { name type { kind name ofType { kind name } } } } } } }"}')
          echo "$response" | node <<'NODE'
          let s='';
          process.stdin.on('data',d=>s+=d).on('end',()=>{
            const x=JSON.parse(s);
            if(x.errors?.length) throw new Error(x.errors.map(e=>e.message).join('; '));
            const pick=(fields)=>fields.filter(f=>/(project|workspace|delete|restore|recover|trash)/i.test(f.name));
            console.log('QUERY_FIELDS='+JSON.stringify(pick(x.data.q.fields),null,2));
            console.log('MUTATION_FIELDS='+JSON.stringify(pick(x.data.m.fields),null,2));
          });
          NODE
      - name: Probe legacy project by exact ID
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query Legacy($id: String!) { project(id: $id) { id name deletedAt workspace { id name } } }","variables":{"id":"9a940d7a-b0b0-4893-a90d-1b0a8b6850d5"}}')
          echo "$response"
