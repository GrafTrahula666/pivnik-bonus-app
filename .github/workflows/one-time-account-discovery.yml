name: One-time Railway account discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/account-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest
      - name: Verify account token identity
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: railway whoami
      - name: List visible Railway projects
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: railway list --json
      - name: Inspect Railway query and mutation names
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          node - <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=process.env.RAILWAY_API_TOKEN;
          async function gql(query, variables={}) {
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query,variables})});
            const text=await r.text();
            console.log('HTTP='+r.status);
            let x; try{x=JSON.parse(text)}catch{console.log(text); return null}
            if(x.errors?.length) console.log('ERRORS='+x.errors.map(e=>e.message).join(' | '));
            return x.data;
          }
          const q=await gql('query { __type(name: "Query") { fields(includeDeprecated: true) { name } } }');
          const m=await gql('query { __type(name: "Mutation") { fields(includeDeprecated: true) { name } } }');
          const pick=(a)=>a?.__type?.fields?.map(x=>x.name).filter(n=>/(project|workspace|delete|restore|recover|trash)/i.test(n))||[];
          console.log('QUERY_FIELDS='+JSON.stringify(pick(q)));
          console.log('MUTATION_FIELDS='+JSON.stringify(pick(m)));
          const legacy=await gql('query Legacy($id: String!) { project(id: $id) { id name deletedAt workspace { id name } } }',{id:'9a940d7a-b0b0-4893-a90d-1b0a8b6850d5'});
          console.log('LEGACY='+JSON.stringify(legacy?.project??null));
          NODE
