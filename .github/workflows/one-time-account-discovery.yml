name: One-time Railway account discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/account-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Query deleted and external Railway projects
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          node - <<'NODE'
          const endpoint='https://backboard.railway.com/graphql/v2';
          const token=process.env.RAILWAY_API_TOKEN;
          async function gql(query, variables={}) {
            const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({query,variables})});
            const x=await r.json().catch(()=>({}));
            if(x.errors?.length) console.log('ERRORS='+x.errors.map(e=>e.message).join(' | '));
            return x.data;
          }
          const all=await gql(`query { projects(first:100, includeDeleted:true) { edges { node { id name createdAt updatedAt deletedAt workspace { id name } services { edges { node { id name } } } } } } }`);
          console.log('ALL_WITH_DELETED='+JSON.stringify(all?.projects?.edges?.map(e=>e.node)||[],null,2));
          const ext=await gql('query($projectId:String){ externalWorkspaces(projectId:$projectId){ id name } }',{projectId:'9a940d7a-b0b0-4893-a90d-1b0a8b6850d5'});
          console.log('EXTERNAL_FOR_LEGACY='+JSON.stringify(ext?.externalWorkspaces??null,null,2));
          const oldWs=await gql('query($id:String!){ workspace(workspaceId:$id){ id name } }',{id:'fbffb30c-9091-432f-9e09-9c59e1440304'});
          console.log('OLD_WORKSPACE='+JSON.stringify(oldWs?.workspace??null,null,2));
          NODE
