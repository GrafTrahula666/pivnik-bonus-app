name: One-time wheel artwork repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-wheel-artwork-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix wheel label placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          source = path.read_text(encoding='utf-8')
          old = """    const flipped = sector.center > 90 && sector.center < 270;\n    const labelRotation = flipped ? 90 : -90;\n    const labelY = flipped ? 268 : 52;"""
          new = """    const flipped = sector.center > 90 && sector.center < 270;\n    const labelRotation = flipped ? 90 : -90;\n    // Keep every label on the same radial ring. Moving flipped labels to y=268\n    // mirrors them into the upper half of the wheel and leaves the bottom empty.\n    const labelY = 52;"""
          if old not in source:
              raise SystemExit('Expected wheel label block was not found; refusing to patch a different state.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify wheel source
        run: |
          node --check app.js
          node --test test/wheel-ui.source.test.js

      - name: Commit repaired artwork
        shell: bash
        run: |
          git config user.name "Pivnik Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git commit -m "Fix Telegram wheel label placement"
          git push origin HEAD:main
