name: One-time legacy Pivnik database secret probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/legacy-db-secret-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S_DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
      S_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      S_POSTGRES_PUBLIC_URL: ${{ secrets.POSTGRES_PUBLIC_URL }}
      S_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      S_PIVNIK_DATABASE_URL: ${{ secrets.PIVNIK_DATABASE_URL }}
      S_RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Report only secret presence and safely fingerprint reachable databases
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { Client } from 'pg';
          const candidates={
            DATABASE_URL:process.env.S_DATABASE_URL,
            DATABASE_PUBLIC_URL:process.env.S_DATABASE_PUBLIC_URL,
            POSTGRES_URL:process.env.S_POSTGRES_URL,
            POSTGRES_PUBLIC_URL:process.env.S_POSTGRES_PUBLIC_URL,
            PRODUCTION_DATABASE_URL:process.env.S_PRODUCTION_DATABASE_URL,
            PIVNIK_DATABASE_URL:process.env.S_PIVNIK_DATABASE_URL,
            RAILWAY_DATABASE_URL:process.env.S_RAILWAY_DATABASE_URL
          };
          for(const [name,url] of Object.entries(candidates)){
            if(!url){ console.log(`${name}=MISSING`); continue; }
            console.log(`${name}=PRESENT`);
            try{
              const c=new Client({connectionString:url,ssl:/railway\.internal/i.test(url)?false:{rejectUnauthorized:false},connectionTimeoutMillis:5000,statement_timeout:5000});
              await c.connect();
              let counts={};
              for(const table of ['users','wallets','transactions','beer_loyalty','shifts']){
                try{const r=await c.query(`SELECT COUNT(*)::int AS n FROM ${table}`); counts[table]=r.rows[0].n;}catch{counts[table]='missing';}
              }
              let fingerprint='unknown';
              try{
                const r=await c.query("SELECT value FROM app_meta WHERE key='database_identity' LIMIT 1");
                if(r.rows[0]?.value) fingerprint=crypto.createHash('sha256').update(String(r.rows[0].value)).digest('hex').slice(0,20);
              }catch{}
              console.log(`${name}_REACHABLE=true COUNTS=${JSON.stringify(counts)} FINGERPRINT=${fingerprint}`);
              await c.end();
            }catch(e){
              console.log(`${name}_REACHABLE=false ERROR_CLASS=${String(e.code||e.name||'error').slice(0,40)}`);
            }
          }
          NODE
