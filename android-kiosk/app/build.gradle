plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.pivnik.kiosk'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.pivnik.kiosk'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        debug {
            def kioskDebugHome = System.getenv('KIOSK_DEBUG_HOME')
            if (kioskDebugHome) {
                storeFile file("${kioskDebugHome}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
