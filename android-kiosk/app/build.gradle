plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.pivnik.kiosk'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.pivnik.kiosk'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
