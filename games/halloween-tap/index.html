<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Хэллоуин: Лови тыкву</title>
<style>
  :root {
    --bg-top: #1a0f2b;
    --bg-bottom: #0a0612;
    --accent: #ff8a1e;
    --accent-dark: #c2560a;
    --panel: rgba(20, 12, 32, 0.72);
    --ghost: #8f7bd1;
    --text: #f3ecff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-top), var(--bg-bottom) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    z-index: 5;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
    opacity: 0.9;
  }
  #score {
    font-size: 20px;
    font-weight: 700;
    background: var(--panel);
    border: 1px solid rgba(255, 138, 30, 0.35);
    border-radius: 14px;
    padding: 6px 16px;
    min-width: 54px;
    text-align: center;
  }
  .target {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    cursor: pointer;
    background: rgba(255, 138, 30, 0.12);
    border: 2px solid rgba(255, 138, 30, 0.5);
    box-shadow: 0 0 18px rgba(255, 138, 30, 0.25);
    animation: pop 0.14s ease-out;
    transform-origin: center;
  }
  .target.ghost {
    background: rgba(143, 123, 209, 0.12);
    border-color: rgba(143, 123, 209, 0.55);
    box-shadow: 0 0 18px rgba(143, 123, 209, 0.3);
  }
  @keyframes pop {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .target.hit {
    animation: hit 0.18s ease-out forwards;
  }
  @keyframes hit {
    to { transform: scale(1.5); opacity: 0; }
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: rgba(8, 5, 14, 0.78);
    z-index: 10;
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay .emoji { font-size: 54px; }
  #overlay .result {
    font-size: 16px;
    opacity: 0.85;
  }
  button#action {
    font-size: 17px;
    font-weight: 700;
    color: #1a0f2b;
    background: linear-gradient(180deg, #ffab4d, var(--accent));
    border: none;
    border-radius: 16px;
    padding: 14px 34px;
    box-shadow: 0 6px 0 var(--accent-dark), 0 10px 20px rgba(255, 138, 30, 0.3);
    cursor: pointer;
  }
  button#action:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 var(--accent-dark);
  }
  #timer-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--accent), #ffd27a);
    width: 100%;
    z-index: 5;
    transition: width 1s linear;
  }
</style>
</head>
<body>
  <div id="stage">
    <header>
      <h1>🎃 Лови тыкву</h1>
      <div id="score">0</div>
    </header>
    <div id="timer-bar"></div>
    <div id="overlay">
      <div class="emoji">🎃</div>
      <button id="action">Играть</button>
      <div class="result" id="result"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var actionBtn = document.getElementById("action");
  var scoreEl = document.getElementById("score");
  var resultEl = document.getElementById("result");
  var timerBar = document.getElementById("timer-bar");

  var ROUND_MS = 30000;
  var MIN_LIFE_MS = 650;
  var MAX_LIFE_MS = 1150;
  var GHOST_CHANCE = 0.22;

  var score = 0;
  var running = false;
  var spawnTimeout = null;
  var roundEndAt = 0;
  var rafId = null;
  var activeTargets = [];

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function spawnTarget() {
    if (!running) return;

    var isGhost = Math.random() < GHOST_CHANCE;
    var el = document.createElement("div");
    el.className = "target" + (isGhost ? " ghost" : "");
    el.textContent = isGhost ? "👻" : "🎃";

    var rect = stage.getBoundingClientRect();
    var size = 64;
    var margin = 14;
    var top = rand(90, rect.height - size - margin - 20);
    var left = rand(margin, rect.width - size - margin);
    el.style.top = top + "px";
    el.style.left = left + "px";

    var life = rand(MIN_LIFE_MS, MAX_LIFE_MS);
    var removed = false;

    function remove() {
      if (removed) return;
      removed = true;
      var idx = activeTargets.indexOf(entry);
      if (idx >= 0) activeTargets.splice(idx, 1);
      if (el.parentNode) el.parentNode.removeChild(el);
    }

    var lifeTimer = setTimeout(remove, life);

    el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      if (removed) return;
      clearTimeout(lifeTimer);
      el.classList.add("hit");
      if (!isGhost) {
        score += 1;
        scoreEl.textContent = String(score);
      }
      setTimeout(remove, 180);
    });

    stage.appendChild(el);
    var entry = { remove: remove };
    activeTargets.push(entry);

    var nextIn = rand(380, 720);
    spawnTimeout = setTimeout(spawnTarget, nextIn);
  }

  function clearTargets() {
    activeTargets.slice().forEach(function (t) { t.remove(); });
    activeTargets = [];
  }

  function tick() {
    if (!running) return;
    var remaining = roundEndAt - Date.now();
    var pct = Math.max(0, Math.min(1, remaining / ROUND_MS));
    timerBar.style.width = (pct * 100) + "%";
    if (remaining <= 0) {
      endGame();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = "0";
    overlay.classList.add("hidden");
    timerBar.style.width = "100%";
    running = true;
    roundEndAt = Date.now() + ROUND_MS;
    spawnTarget();
    rafId = requestAnimationFrame(tick);
  }

  function endGame() {
    running = false;
    if (spawnTimeout) clearTimeout(spawnTimeout);
    if (rafId) cancelAnimationFrame(rafId);
    clearTargets();
    resultEl.textContent = "Счёт: " + score;
    actionBtn.textContent = "Ещё раз";
    overlay.classList.remove("hidden");
  }

  actionBtn.addEventListener("click", startGame);
})();
</script>
</body>
</html>
