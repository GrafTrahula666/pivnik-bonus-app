plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.pivnik.evotor'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.pivnik.evotor.bridge'
        // integration-library v0.6.40: minSdkVersion 23, targetSdkVersion 30.
        minSdk 23
        targetSdk 30
        versionCode 4
        versionName '1.0.0'
        // app_uuid issued for "PIVNIK для Эвотора" in the Evotor developer account (not a secret:
        // it ships in the manifest). Override with -PevotorAppUuid=... or EVOTOR_APP_UUID.
        manifestPlaceholders = [
                evotorAppUuid: (project.findProperty('evotorAppUuid')
                        ?: System.getenv('EVOTOR_APP_UUID')
                        ?: '70110ab9-7265-4a13-8320-fa164642b321')
        ]
    }

    signingConfigs {
        debug {
            // Permanent key (GitHub secrets) when provided: builds then install over each other.
            // Without it, the CI falls back to a throwaway debug key and the old app must be removed first.
            def keystoreFile = System.getenv('EVOTOR_KEYSTORE_FILE')
            def bridgeDebugHome = System.getenv('EVOTOR_BRIDGE_DEBUG_HOME')
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('EVOTOR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('EVOTOR_KEY_ALIAS')
                keyPassword System.getenv('EVOTOR_KEY_PASSWORD')
            } else if (bridgeDebugHome) {
                storeFile file("${bridgeDebugHome}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // Evotor POS apps target the SDK level of the terminal firmware, not the Play Store minimum.
        disable 'ExpiredTargetSdkVersion'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'com.github.evotor:integration-library:v0.6.40'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (Android's copy is a stub off-device).
    testImplementation 'org.json:json:20240303'
}
