<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0610">
<title>Pivnik Run</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--or:#ff9a2e;--or2:#ffc247;--vi:#9b5cff;--glass:rgba(18,10,24,.72)}
*{box-sizing:border-box}
html,body{overscroll-behavior:none;margin:0;height:100%;background:#07040a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#game{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;pointer-events:none;display:none}
#prog{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--or2));box-shadow:0 0 10px var(--or)}
#prog.tun i{background:linear-gradient(90deg,#4de2ff,var(--vi));box-shadow:0 0 12px var(--vi)}
#score{margin-top:10px;text-align:center;font-size:46px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 18px rgba(255,154,46,.55)}
#row{display:flex;justify-content:center;gap:8px;margin-top:2px}
.pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--glass);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.pill b{display:block;height:3px;border-radius:3px;background:currentColor;margin-top:2px}
.pw{flex-direction:column;gap:0;padding:4px 10px 5px;min-width:46px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px calc(env(safe-area-inset-bottom) + 24px);background:radial-gradient(120% 80% at 50% 30%,rgba(20,8,30,.35),rgba(6,2,10,.88))}
.hide{display:none!important}
#snd{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:5;width:38px;height:34px;border-radius:999px;background:rgba(10,4,24,.7);color:#ffe2b0;font-size:16px;line-height:1;border:1px solid rgba(255,150,45,.55);cursor:pointer;padding:0}
#score.pop{animation:scorePop .22s ease-out}@keyframes scorePop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
.lbs{margin-top:-10px;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;max-width:92%;padding:8px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,194,71,.25);color:#f3e6d2;font:700 13px/1.2 system-ui,sans-serif;white-space:nowrap;overflow:hidden}
.lbs b{color:#ffd27a;font-variant-numeric:tabular-nums}.lbs span{overflow:hidden;text-overflow:ellipsis}
#lbBox{z-index:30;background:rgba(6,2,10,.97);justify-content:flex-start;gap:12px;padding-top:calc(env(safe-area-inset-top) + 18px)}
#lbBox h2{margin:0;font-size:26px;font-weight:900;letter-spacing:1px;color:#ffd27a}
#lbList{width:100%;max-width:420px;flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:6px}
.lbr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--glass);font-weight:700;font-size:15px}
.lbr i{font-style:normal;width:30px;color:#ffd27a;font-variant-numeric:tabular-nums}.lbr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr b{font-variant-numeric:tabular-nums}
.lbr.me{box-shadow:0 0 0 1.5px var(--or);background:rgba(255,150,40,.16)}
.lbe{color:#e9d9c6;text-align:center;padding:24px 8px;font-size:15px}

#menu{justify-content:flex-start;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.55)),url(loc/menu-bg.webp) center 75%/cover no-repeat #120904}
#menu h1{margin-top:calc(env(safe-area-inset-top) + 2vh)}
#exitApp{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:5;padding:7px 12px;border-radius:999px;background:rgba(10,4,24,.7);color:#ffe2b0;font:700 13px system-ui;text-decoration:none;border:1px solid rgba(255,150,45,.55)}
#menu{gap:14px}
#menu .car{flex:1;min-height:0;height:auto;max-height:420px;margin-top:auto}
#menu .cname{margin-top:0}
#menu .cdesc{margin-top:-6px}
h1{position:relative;z-index:3;margin:0;font-size:52px;line-height:.95;font-weight:900;text-align:center;letter-spacing:2px;background:linear-gradient(180deg,#fff2c9,var(--or2) 45%,var(--or));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,140,30,.55)) drop-shadow(0 3px 0 #3a1404)}
h1 small{display:block;font-size:22px;letter-spacing:10px;margin-top:6px}
.car{position:relative;width:100%;max-width:420px;height:min(46vh,380px);touch-action:none}
.slot{position:absolute;left:50%;bottom:0;width:62%;aspect-ratio:1;max-width:100%;transform:translateX(-50%);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s,filter .32s;pointer-events:none}
.slot:not(.round){height:100%;width:auto;aspect-ratio:.62}
.slot img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
.slot.round img{border-radius:50%;border:5px solid var(--c);box-shadow:0 0 0 6px rgba(0,0,0,.35),0 0 40px var(--c)}
.slot.l{transform:translateX(-135%) scale(.5);opacity:.5;filter:brightness(.6)}
.slot.r{transform:translateX(35%) scale(.5);opacity:.5;filter:brightness(.6)}
.slot.off{opacity:0;transform:translateX(-50%) scale(.3)}
.slot img{transform-origin:50% 100%}
.slot .prop{position:absolute;font-style:normal;font-size:clamp(26px,8vw,40px);opacity:0;filter:drop-shadow(0 2px 3px #000);pointer-events:none}
.slot:not(.c) img,.slot:not(.c) .prop{animation:none!important}
.slot.c.a-flex img{animation:flex 2.6s ease-in-out infinite}
.slot.c.a-flex .prop{left:2%;top:30%;animation:pop 2.6s ease-in-out infinite}
@keyframes flex{0%,55%,100%{transform:none}65%,85%{transform:scale(1.07,1.03) rotate(-2deg)}75%{transform:scale(1.09,1.04) rotate(2deg)}}
@keyframes pop{0%,58%,100%{opacity:0;transform:scale(.3)}66%,86%{opacity:1;transform:scale(1.15) rotate(-12deg)}76%{opacity:1;transform:scale(1) rotate(8deg)}}
.slot.c.a-sway img{animation:sway 2.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}25%{transform:rotate(0) translateY(-2%)}50%{transform:rotate(3deg) translateY(0)}75%{transform:rotate(0) translateY(-2%)}}
.slot.c.a-turn img{animation:turn 4s ease-in-out infinite}
@keyframes turn{0%,40%,100%{transform:none}55%,80%{transform:perspective(600px) rotateY(62deg) rotate(-3deg);filter:drop-shadow(0 14px 18px rgba(0,0,0,.6)) brightness(.75)}}
/* the guardian demon: art has a dark smoky backdrop, so it is screened in and its edges fade out */
.slot .guard{position:absolute;left:-10.5%;width:121%;bottom:0;z-index:-1;opacity:0;transform:translateY(14%) scale(.82);transform-origin:50% 100%;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(closest-side,#000 58%,transparent 100%);mask-image:radial-gradient(closest-side,#000 58%,transparent 100%);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.slot .guard img{display:block;width:100%;height:auto;object-fit:fill;filter:none;animation:none!important;transform:none!important}
.slot.c .guard{opacity:.9;transform:none;animation:guardBreath 4.2s ease-in-out .8s infinite}
@keyframes guardBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035) translateY(-1%)}}
.slot.c.a-trick img{animation:trick 3.2s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes trick{0%,60%,100%{transform:none}70%{transform:translateY(-22%) rotate(-10deg)}80%{transform:translateY(-26%) rotate(350deg)}90%{transform:translateY(0) rotate(360deg) scale(1.04,.96)}}
.slot.c.a-drink img{animation:drink 3.4s ease-in-out infinite}
.slot.c.a-drink .prop{left:58%;top:22%;animation:bottle 3.4s ease-in-out infinite}
@keyframes drink{0%,35%,100%{transform:none}50%,75%{transform:rotate(-5deg) translateY(-1%)}}
@keyframes bottle{0%,25%,100%{opacity:0;transform:translate(30%,60%) rotate(0)}40%{opacity:1;transform:translate(0,0) rotate(-20deg)}50%,75%{opacity:1;transform:translate(-25%,-10%) rotate(-120deg)}88%{opacity:0;transform:translate(10%,40%) rotate(-30deg)}}
.slot.c.a-music img{animation:nod .55s ease-in-out infinite alternate}
@keyframes nod{from{transform:rotate(-2deg)}to{transform:rotate(2deg) translateY(1%)}}
.slot.c.a-guitar .prop.n{left:30%;top:41%;font-size:clamp(22px,7vw,34px);opacity:1;animation:strum .3s ease-in-out infinite alternate-reverse}
.slot.c.a-music .prop{left:68%;top:8%;animation:note 1.8s linear infinite}
@keyframes note{0%{opacity:0;transform:translate(0,40%) rotate(-10deg)}20%{opacity:1}100%{opacity:0;transform:translate(40%,-80%) rotate(15deg)}}
.slot.c.a-guitar img{animation:rock .4s ease-in-out infinite alternate}
.slot.c.a-guitar .prop.g{left:24%;top:46%;font-size:clamp(40px,13vw,64px);opacity:1;animation:strum .2s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes strum{from{transform:rotate(-38deg)}to{transform:rotate(-30deg) translateY(3%)}}
.slot span{position:absolute;right:4%;bottom:4%;font-size:clamp(28px,9vw,44px);filter:drop-shadow(0 2px 3px #000)}
.slot:not(.c) span{display:none}
.arr{position:absolute;top:62%;transform:translateY(-50%);z-index:2;width:52px;height:52px;border-radius:50%;border:0;background:rgba(18,10,24,.72);color:#ffd27a;font:900 34px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 0 0 2px rgba(255,194,71,.35)}
.arr:active{transform:translateY(-50%) scale(.92)}
.arr.l{left:0}.arr.r{right:0}
.ghost{border:0;background:none;color:#e9d9c6;font:700 16px/1 system-ui,sans-serif;padding:10px 16px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.btn{border:0;border-radius:999px;padding:16px 46px;font-family:inherit;font-size:22px;font-weight:900;line-height:1;color:#2a1000;background:linear-gradient(180deg,#ffe08a,var(--or2) 40%,var(--or));box-shadow:0 6px 0 #a24d08,0 0 30px rgba(255,150,40,.5);cursor:pointer;letter-spacing:.5px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a24d08,0 0 20px rgba(255,150,40,.4)}
.big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,154,46,.6)}
.rec{color:var(--or2);font-weight:900;font-size:18px;letter-spacing:2px;margin-top:-18px}
.best{color:#e9d9c6;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;margin-top:-10px}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#fog{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.5) 0 1.5%,transparent 2.5%) 0 0/90px 110px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.4) 0 1%,transparent 2%) 0 0/70px 80px,radial-gradient(ellipse at 50% 55%,rgba(205,212,218,.55),rgba(225,230,235,.95) 75%)}
.pw img,.pill img{width:26px;height:26px;display:block}
.pw{padding:3px 6px 5px;min-width:0}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 128px);transform:translate(-50%,-14px) scale(.85);opacity:0;display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(6px);font-weight:900;font-size:19px;pointer-events:none;white-space:nowrap;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
#toast img{width:44px;height:44px}
#toast.show{animation:toast 1.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px) scale(.85)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.95)}}
#sup{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);width:64px;height:64px;border-radius:50%;padding:5px;background:conic-gradient(var(--sc,#ffc247) calc(var(--p,0)*1turn),rgba(255,255,255,.14) 0);pointer-events:none;display:none}
#sup img{width:100%;height:100%;display:block;filter:grayscale(.85) brightness(.6)}
#sup.full img{filter:none}
#sup.full{animation:supp 1s ease-in-out infinite}
#sup small{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap;color:#ffe7a8;text-shadow:0 1px 2px #000;opacity:0}
#sup.full small{opacity:1}
@keyframes supp{50%{transform:scale(1.1);box-shadow:0 0 22px var(--sc,#ffc247)}}
.cname{font-weight:900;font-size:24px;letter-spacing:1px;margin-top:-10px;text-shadow:0 2px 8px #000}
.cname img.gedo{width:28px;height:28px;vertical-align:-5px;margin-left:8px}
.cdesc{max-width:320px;margin-top:-12px;padding:10px 14px;border-radius:14px;background:var(--glass);backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,194,71,.25);font-size:14px;line-height:1.35;text-align:center;color:#f3e6d2}
.cdesc b{color:#ffd27a}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="flash"></div>
  <div id="fog"></div>
  <div id="hud">
    <div id="prog"><i></i></div>
    <div id="score">0</div>
    <div id="row"><div class="pill" id="coins"><span id="cem"></span><span id="cn">0</span></div></div>
  </div>
  <div id="sup"><img alt=""><small>2× тап</small></div>
  <div id="toast"></div>
  <div class="screen" id="menu">
    <a id="exitApp" href="/" >‹ В приложение</a>
    <button id="snd" type="button" aria-label="Звук"></button>
    <h1>PIVNIK<small>RUN</small></h1>
    <div class="car" id="car">
      <button class="arr l" id="prev" aria-label="Предыдущий персонаж">‹</button>
      <button class="arr r" id="next" aria-label="Следующий персонаж">›</button>
    </div>
    <div class="cname" id="cname"></div>
    <div class="cdesc" id="cdesc"></div>
    <button class="btn" id="play">Играть</button>
    <button class="lbs hide" id="lbStrip" type="button"></button>
  </div>
  <div class="screen hide" id="lbBox">
    <h2>🏆 Рейтинг</h2>
    <div id="lbList"></div>
    <button class="ghost" id="lbClose" type="button">Закрыть</button>
  </div>
  <div class="screen hide" id="over">
    <div class="big" id="final">0</div>
    <div class="rec hide" id="rec">★ РЕКОРД ★</div>
    <div class="best" id="best"></div>
    <div class="best hide" id="place"></div>
    <button class="btn" id="again">Заново</button>
    <button class="ghost" id="tomenu">Сменить персонажа</button>
  </div>
</div>
<script>
(() => {
'use strict';
const QS = new URLSearchParams(location.search);
const LOC_SECONDS = +QS.get('loc') || 60;
const GOD = QS.has('god');

const $ = s => document.querySelector(s);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

// Locations follow the owner's photo order 2 → 3 → 5 → 7 → 6, then repeat.
const LOCS = [
  { img: 'loc/1-holodilniki.webp', vy: .40, lanes: 3, fog: '#2a1606', floorA: '#5e3d24', floorB: '#53351f', glow: '#ffc247', sk: { block: 'pack', low: 'foot', over: 'beam', drop: 'pack' } },
  { img: 'loc/2-okno.webp',        vy: .47, lanes: 2, fog: '#24140a', floorA: '#5a3a24', floorB: '#4f331f', glow: '#ffbe3c', sk: { block: 'pouf', low: 'bench', over: 'table', drop: 'mug' } },
  { img: 'loc/3-mia.webp',         vy: .43, lanes: 3, fog: '#2a1208', floorA: '#5e3c22', floorB: '#52341d', glow: '#ffc247', sk: { block: 'box', low: 'foot', over: 'rope', drop: 'keg' } },
  { img: 'loc/4-kirpich.webp',     vy: .44, lanes: 1, fog: '#2c1609', floorA: '#634026', floorB: '#573820', glow: '#ffd04f', sk: { block: 'box', low: 'bricks', over: 'lamp', drop: 'brick' } },
  { img: 'loc/5-krany.webp',       vy: .50, lanes: 3, fog: '#2e1808', floorA: '#4a3426', floorB: '#3f2c20', glow: '#ffbf3a', sk: { block: 'snacks', low: 'glass', over: 'pipe', drop: 'keg' } },
  // behind the bar counter: Temple Run style laps with right turns and falling forks
  { counter: true,                 vy: .42, lanes: 2, fog: '#120904', floorA: '#2c2c31', floorB: '#242429', glow: '#ffb02e', sk: { block: 'fork', low: 'forkflat', over: 'beam', drop: 'fork' } },
].map(l => ({ ...l, fog: hex(l.fog), floorA: hex(l.floorA), floorB: hex(l.floorB), glow: hex(l.glow) }));
// Tunnels between locations alternate: Halloween cellar, then the tentacle tunnel.
const TUNNELS = [
  { img: 'loc/t1-pogreb.webp',    vy: .575, lanes: 3, fog: '#1c0c04', floorA: '#3a2214', glow: '#ff8a2a', tex: 'darkwood', sk: { block: 'barrel', low: 'pumpkin', over: 'chandelier', drop: 'barrel' } },
  { img: 'loc/t2-shupaltsa.webp', vy: .585, lanes: 3, fog: '#07140f', floorA: '#22302c', glow: '#3fe0b0', tex: 'stone', sk: { block: 'tentacle', low: 'tentacleLow', over: 'tentacleArch', drop: 'slime' } },
].map(l => ({ ...l, fog: hex(l.fog), floorA: hex(l.floorA), glow: hex(l.glow) }));
TUNNELS.forEach(l => { const i = new Image(); i.src = l.img; l.im = i; });

const CHARS = [
  { id: 'vitaliy', run: 2, name: 'Виталий', desc: 'Таран. Двойной тап раз в 3 минуты, и первое препятствие на пути разлетается в щепки.', anim: 'flex', img: 'chars/vitaliy-front.webp', back: 'chars/vitaliy-back.webp', em: '🍺', col: '#3f7fe0', sup: { kind: 'smash', name: 'Таран', dur: 0, cd: 180 } },
  { id: 'anya',    name: 'Аня',     desc: 'Полёт. Двойной тап раз в 3 минуты, и Аня взлетает над дорожкой. Пока летит, ей ничего не страшно.', anim: 'sway', img: 'chars/anya-front.webp',    back: 'chars/anya-back.webp',    em: '🔥', col: '#e8306a', tall: 1.95, cut: .62, hover: true, sup: { kind: 'fly', name: 'Полёт', dur: 5, cd: 180 } },
  { id: 'kirill', run: 4, name: 'Кирилл',  desc: 'Замедление времени. Двойной тап раз в минуту: мир замедляется на 5 секунд, а очки текут рекой.', anim: 'sway', img: 'chars/kirill-front.webp',  back: 'chars/kirill-back.webp',  em: '🍥', col: '#8a4dff', cut: .6, gedo: true, guardian: true, sup: { kind: 'slow', name: 'Замедление времени', dur: 5, cd: 60 } },
  { id: 'hristina', run: 2, name: 'Христина', desc: 'Порталы. Каждый портал дарит Христине случайный бонус.', anim: 'guitar', img: 'chars/hristina-front.webp', back: 'chars/hristina-back.webp', em: '🍒', col: '#ff4a1a', cut: .58, sup: { kind: 'portal' } },
  { id: 'vlad', run: 3, name: 'Влад',    desc: 'Пивной берсерк. Двойной тап, и Влад открывает литр «Чешского барного». Чем больше выпил, тем сильнее всё плывёт. Чистый хардкор.', anim: 'drink', img: 'chars/vlad-front.webp',    back: 'chars/vlad-back.webp',    em: '🍟', col: '#ffd21a', cut: .63, sup: { kind: 'beer', name: 'Пивной берсерк', dur: 0, cd: 30, max: 5, life: 300 } },
  { id: 'dima', run: 2, name: 'Дима',    desc: 'Магнитофон. Двойной тап раз в 3 минуты включает музыку и приносит случайный бонус.', anim: 'music', img: 'chars/dima-front.webp',    back: 'chars/dima-back.webp',    em: '🎵', col: '#ff8a1a', cut: .6, noFlip: true, sup: { kind: 'boombox', name: 'Магнитофон', dur: 0, cd: 180 } },

const cv = $('#cv'), ctx = cv.getContext('2d');

const CB = 3, MAXD = 46, NEAR = -CB + .25;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);

  W = r.width; H = r.height;
  cv.width = W * DPR | 0; cv.height = H * DPR | 0;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const S = Math.min(W, H * .56);
  U = S * .85;
  HOR = H * .42;
  CAMH = (H * .84 - HOR) / (U / CB);
}
addEventListener('resize', resize);
let YAW = 0;
const pr = (x, h, d) => {

  let bad = 0; if (d < NEAR) { d = NEAR; bad = 1; }
  const s = U / (d + CB), p = [W / 2 + x * s, HOR + (CAMH - h) * s];
  if (bad) p.bad = 1;
  return p;
};
const unitAt = d => U / (Math.max(d, NEAR) + CB);
function quad(a, b, c, e, fill) {
  if (YAW && (a.bad || b.bad || c.bad || e.bad)) return;
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(e[0], e[1]);

function spawnRow(z) {
  const n = g.n, lanes = [...Array(n).keys()];
  const free = new Set(lanes);
  const r = Math.random();
  const L = PAL();
  const KEY = { crate: 'block', boot: 'low', bar: 'over', drop: 'drop' };
  const add = (k, lane, extra = {}) => g.items.push({ k, lane, n, z, sk: L.sk[KEY[k]], ...extra });
  if (L.counter) {
    if (r < .6) { const l = pick(lanes); add('drop', l); free.delete(l); }
    else lanes.forEach(l => add('boot', l));
  } else if (n === 1) {
    add(r < .5 ? 'boot' : 'bar', 0); free.clear();
  } else if (r < .38) {
    const k = n === 3 && Math.random() < .45 ? 2 : 1;
    const shuffled = lanes.sort(() => Math.random() - .5).slice(0, k);
    shuffled.forEach(l => { add('crate', l); free.delete(l); });
  } else if (r < .55) {
    const l = pick(lanes); add('drop', l); free.delete(l);
  } else if (r < .8) {
    const all = Math.random() < .6;
    const use = all ? lanes : lanes.sort(() => Math.random() - .5).slice(0, n - 1);
    use.forEach(l => add('boot', l));
    if (!all) use.forEach(l => free.delete(l));

  const freeL = [...free];

  } else if (Math.random() < .75) {
    const cnt = Math.max(2, Math.min(5, Math.floor(gap * .55 / 1.1)));
    for (let i = 0; i < cnt; i++) g.items.push({ k: 'coin', lane: cl, n, z: cz + i * 1.1 });
  }
}

// Random bonus: x2 40%, magnet 40%, second life 10%, nothing 10% (Христина's portals, Дима's boombox).

  else if (r < .8) { g.mag = 8; toast('mag', from + ': магнит'); }

const CWX = n => n / 2 + .35;
const inCounter = () => g.mode === 'loc' && LOCS[g.loc % LOCS.length].counter;
function turnWindow() {
  if (!inCounter() || !g.cornerZ) return false;

}

function act(a) {
  if (state !== 'run' || g.dead) return;
  if (a === 'R' && turnWindow()) { doTurn(); return; }
  if (a === 'L') { if (g.lane > 0) { sfx('swoosh'); haptic('light'); } g.lane = Math.max(0, g.lane - 1); }
  else if (a === 'R') { if (g.lane < g.n - 1) { sfx('swoosh'); haptic('light'); } g.lane = Math.min(g.n - 1, g.lane + 1); }
  else if (a === 'U') { if (g.y <= .001) { g.vy = 9.4; g.slide = 0; sfx('jump'); haptic('light'); } }
  else if (a === 'D') { if (g.y > .001) g.vy = -16; else sfx('slide'); g.slide = .62; }

function die() {
  if (GOD) return;

function update(dt) {

  if (g.shake > 0) g.shake = Math.max(0, g.shake - dt);
  g.fl = g.fl.filter(f => (f.t += dt) < .8);
  if (g.yaw) { g.yaw *= Math.exp(-dt * 11); if (Math.abs(g.yaw) < .004) g.yaw = 0; }

  if (g.dead) return;

  const sp = SUPER(), slow = g.superT > 0 && sp.kind === 'slow';
  if (slow) g.t -= dt * .5; // the speed-up clock slows down too
  g.beers = g.beers.map(b => b - dt).filter(b => b > 0);
  if (g.drink > 0) g.drink -= dt;

    g.music -= dt;
    if (Math.random() < dt * 14) { const b = pr(g.px, 1.2, 0), u = unitAt(0); g.fl.push({ t: 0, x: b[0] + rnd(-.6, .6) * u, y: b[1], txt: pick(['♪', '♫', '♬']), col: pick(['#ffd27a', '#ff8a1a', '#ffffff']) }); }
  }

function drawItem(it) {
  const d = it.z - g.dist;

  const n = it.n, x = it.lane < 0 ? 0 : laneX(it.lane, n);
  switch (it.k) {
    case 'crate':
      shadow(x, d + .4, .55, .35);
      drawBlock(it.sk, x, d, 0);
      break;
    case 'drop': {
      const h = dropH(d);
      shadow(x, d + .4, .5, .15 + .45 * (1 - h / 6));
      if (h > .05) { // warning ring on the floor
        const p = pr(x, 0, d + .4), u = unitAt(d);

  start: () => { tone(330, .12, 'square', .12); tone(494, .12, 'square', .12, 0, .1); tone(660, .22, 'square', .14, 0, .2); },
  swoosh: () => hiss(.14, .22, 900, 3200),
  jump: () => { tone(260, .2, 'sine', .3, 620); hiss(.12, .08, 600, 2400); },
  land: () => { tone(120, .12, 'sine', .35, 55); hiss(.08, .12, 700, 300); },
  slide: () => hiss(.28, .18, 2600, 700),
  coin: () => {

  life: () => { tone(700, .3, 'sawtooth', .16, 180); hiss(.25, .12, 2400, 500); },

const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function lbRefresh() { const b = await lbApi('leaderboard'); if (b) LB.board = b; lbPaint(); }
$('#lbStrip').onclick = () => { $('#lbBox').classList.remove('hide'); lbRefresh(); };
$('#lbClose').onclick = () => $('#lbBox').classList.add('hide');
async function lbBegin() { LB.ticket = null; const r = await lbApi('start', {}); LB.ticket = r && r.ticket || null; }
async function lbFinish(score) {
  const ticket = LB.ticket; LB.ticket = null;
  if (!ticket) return;
  const b = await lbApi('score', { ticket, score, character: CHARS[store.char].id });
  if (!b) return;
  LB.board = b; lbPaint();
  if (b.me && state === 'over') { const p = $('#place'); p.textContent = '🏆 Твоё место: ' + b.me.rank + ' из ' + b.total; p.classList.remove('hide'); }
}

function start() {
  g = newGame(false); setLanes(g.n); drunkCss(0);
  shownScore = shownCoins = -1;
  $('#cem').textContent = CHARS[store.char].em;
  const sup = $('#sup'); sup.style.display = ['portal', 'mult'].includes(SUPER().kind) ? 'none' : 'block'; sup.style.setProperty('--sc', CHARS[store.char].col); sup.querySelector('img').src = ICONS.super.url;
  $('#menu').classList.add('hide'); $('#over').classList.add('hide');
  $('#hud').style.display = 'block';
  document.querySelectorAll('#row .pw').forEach(e => e.remove());
  state = 'run'; lockSwipes(true);
  lbBegin(); sfx('start'); haptic('light');
}

lbRefresh();
$('#play').onclick = start;
$('#again').onclick = start;
$('#tomenu').onclick = toMenu;

// ---------- input ----------
// One finger stroke = exactly one move, however long or fast the swipe is.
let sx = 0, sy = 0, down = false, pid = null;
const game = $('#game');
let tapT0 = 0, lastTap = 0;
game.addEventListener('pointerdown', e => { if (down) return; down = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; tapT0 = performance.now(); });
game.addEventListener('pointermove', e => {
  if (!down || e.pointerId !== pid || state === 'over') return;
  const dx = e.clientX - sx, dy = e.clientY - sy, th = 24;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  down = false;
  if (state === 'menu') { if (Math.abs(dx) > Math.abs(dy)) pickChar(dx < 0 ? 1 : -1); return; }
  act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
});
// a quick tap that didn't turn into a swipe; two of them close together fire the superpower
const release = e => {
  if (e.pointerId !== pid) return;
  const now = performance.now();
  if (down && state === 'run' && now - tapT0 < 260) {
    if (now - lastTap < 330) { superpower(); lastTap = 0; } else lastTap = now;
  }
  down = false; pid = null;
};
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e => {
  const m = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'U', KeyW: 'U', Space: 'U', ArrowDown: 'D', KeyS: 'D' }[e.code];
  if (state === 'menu' && (m === 'L' || m === 'R')) { pickChar(m === 'L' ? -1 : 1); e.preventDefault(); return; }
  if (state !== 'run' && (e.code === 'Enter' || e.code === 'Space')) { start(); e.preventDefault(); return; }
  if (e.code === 'KeyE' || e.code === 'ShiftLeft') { superpower(); e.preventDefault(); return; }
  if (m) { act(m); e.preventDefault(); }
});

// ---------- loop ----------
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (state !== 'over') update(dt);
  if (state !== 'menu') render();
  if (state === 'run') hud();
  requestAnimationFrame(loop);
}
resize();
renderCar();
g = newGame(true);
requestAnimationFrame(loop);
window.__run = { get g() { return g; }, get state() { return state; }, act, start };
})();
</script>
